<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Life World</title>
<style>
:root{--bg:#f6efe4;--card:#fffdf9;--ink:#2d2a26;--muted:#7a7166;--accent:#e8743b;--ok:#3a9d5d;--line:#e3d6c3;--shadow:0 6px 24px #5a3d1f1a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;max-width:1280px;margin:auto;flex-wrap:wrap}
h1{font-size:20px;margin:0}h1 span{color:var(--accent)}
.hud{display:flex;gap:8px;align-items:center}
.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}
.stat.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.2)}}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px;max-width:1280px;margin:auto;padding:0 16px 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.scene{background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--shadow);position:relative;align-self:start}
.scene-bar{display:flex;justify-content:space-between;align-items:center;margin:4px 8px 6px;font-size:14px;color:var(--muted);gap:8px}
#room{width:100%;height:auto;display:block;border-radius:14px;touch-action:manipulation}
.obj{cursor:pointer}
.hit{fill:transparent}
.obj:hover .vec,.obj:focus .vec,.obj.sel .vec{filter:drop-shadow(0 0 5px #ffb46a) drop-shadow(0 0 2px #e8743b)}
.obj:focus{outline:none}
.obj.pulse .vec{animation:pulse 1s ease-in-out 3}@keyframes pulse{50%{filter:drop-shadow(0 0 12px #ff9a3c)}}
.tag{pointer-events:none;font:700 13px system-ui;fill:#5a3d1f;paint-order:stroke;stroke:#fffdf9;stroke-width:4px;opacity:0;transition:opacity .2s}
.obj:hover .tag,.obj:focus .tag,.obj.sel .tag,.show-tags .tag{opacity:1}
/* character parts */
#char .legB,#char .legF{transform-origin:0 -58px}
#char #upper{transform-origin:0 0;transition:transform .35s}
#char #arm{transform-origin:0 0;transition:transform .35s}
#char.walk .legF{animation:legs .45s ease-in-out infinite alternate}
#char.walk .legB{animation:legs .45s ease-in-out infinite alternate-reverse}
#char.walk #bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes legs{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes bob{to{transform:translateY(-3px)}}
#char.idle #bob{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-1.5px)}}
#char.reach #arm{transform:rotate(-80deg)}
#char.bend #upper{transform:rotate(28deg)}#char.bend #arm{transform:rotate(-20deg)}
#char.drink #arm{transform:rotate(-150deg)}
#char.pour #arm{transform:rotate(-95deg)}#char.pour #hand>*{transform:rotate(-70deg)}
#char.sweep #arm{animation:sweepA .5s ease-in-out infinite alternate}@keyframes sweepA{from{transform:rotate(-5deg)}to{transform:rotate(-38deg)}}
#char.wipe #arm{animation:wipeA .45s ease-in-out infinite alternate}@keyframes wipeA{from{transform:rotate(-60deg)}to{transform:rotate(-95deg)}}
#char.water #arm{transform:rotate(-70deg)}#char.water #hand>*{transform:rotate(35deg);transition:transform .4s}
#char.sit #upper{transform:translateY(30px)}#char.sit .legs{transform:scaleY(.42) translateY(-6px)}
#char.sit .legF{transform:rotate(-60deg)}
#char .legs{transform-origin:0 0;transition:transform .35s}
.door{transform-origin:960px 0;transition:transform .6s ease}
.fridge-open .door{transform:scaleX(.12)}
.pane{transition:transform .7s}.win-open #paneL{transform:scaleX(.22)}.win-open #paneR{transform:scaleX(.22)}
#paneL{transform-origin:438px 0}#paneR{transform-origin:582px 0}
#drops{opacity:0}.watering #drops{opacity:1;animation:drop .6s linear infinite}@keyframes drop{to{transform:translateY(14px)}}
.dust{opacity:0;transition:opacity .6s}.dusty .dust{opacity:.75}
.sparkle{opacity:0}.shine .sparkle{animation:sp 1.2s ease}@keyframes sp{30%{opacity:1}100%{opacity:0}}
#leaves{transform-origin:236px 372px;animation:sway 4s ease-in-out infinite}@keyframes sway{50%{transform:rotate(1.5deg)}}
#steam{animation:steam 3s ease-in-out infinite;opacity:.5}@keyframes steam{50%{transform:translateY(-6px);opacity:.15}}
/* panel */
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:12px 10px}
.ohead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ohead b{font-size:22px}.ohead span{color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:15px;color:var(--ink)}
.act:hover:not(:disabled){border-color:var(--accent);background:#fff6ef}
.act:disabled{opacity:.55;cursor:not-allowed}
.act .dot{width:10px;height:10px;border-radius:50%;flex:none}
.act small{display:block;color:var(--muted);font-size:13px}
.act .why{color:#b05a2a;font-size:12px}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.steps button{flex:1;min-width:58px;border:0;background:#f3ebe0;padding:8px 4px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--ink)}
.steps button.on{background:var(--accent);color:#fff}
.sent{font-size:23px;font-weight:700;margin:6px 0;line-height:1.7}
.sent .w{cursor:pointer;border-radius:4px;display:inline-block}.sent .w:hover{background:#ffe3d1}
.sent .key{color:var(--accent)}
.sent .w.lv-new::after{content:attr(data-vi);display:block;font-size:11px;font-weight:400;color:var(--muted);text-align:center;line-height:1}
.sent .w.lv-learning{text-decoration:underline dotted var(--accent);text-underline-offset:5px}
.vi{color:var(--muted);margin-bottom:10px}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}
.btn.sec{background:#f3ebe0;color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}
.vocab{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:#f8f2e9;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.chip small{color:var(--muted);display:block}
.note{background:#fff7e8;border-left:4px solid #f0b54a;padding:8px 10px;border-radius:6px;font-size:14px;margin:10px 0}
.pat{font-size:14px;color:var(--muted)}.pat b{color:var(--ink)}
.res{margin-top:10px;font-size:15px}.good{color:var(--ok)}.bad{color:#c0392b}
.chunk{display:inline-block;background:#f3ebe0;padding:6px 10px;border-radius:8px;margin:3px}.chunk.on{background:var(--accent);color:#fff}
.opts button{display:block;width:100%;text-align:left;margin:6px 0}
.hint{font-size:13px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0;margin-bottom:6px}
.guide{position:sticky;bottom:12px;max-width:1280px;margin:0 auto 12px;padding:0 16px;z-index:5}
.guide button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:15px;color:var(--ink)}
.guide .face{font-size:34px}.guide b{display:block}.guide span{color:var(--muted)}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:18px;padding:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;gap:8px}
.box h3{font-size:15px;margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 10px 14px;position:relative;background:#fffdf8;cursor:pointer}
.tile::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:4px;border-radius:2px;background:var(--sc,#ccc)}
.tile .en{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
#char.point #arm{transform:rotate(-70deg)}
#char.sit.drink #arm{transform:rotate(-150deg)}
.tvscreen{fill:#2b3440;transition:fill .4s}
.tv-on .tvscreen{fill:#6fb3d9;animation:tvf 1.6s steps(2) infinite}
@keyframes tvf{50%{fill:#8fd19a}}
.tv-on .tvglow{opacity:.35}.tvglow{opacity:0;transition:opacity .4s}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.leftcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.leftcol .scene{align-self:stretch}
.card2{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.card2 h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card2 h2 .meta{font-weight:400}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ctrls .iconbtn{font-size:13px;padding:6px 9px}
.iconbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.q{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.q li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;background:#fff}
.q li .n{width:20px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.q li .t{flex:1;min-width:0}.q li .t small{display:block;color:var(--muted);font-size:12px}
.q li .st{font-size:12px;white-space:nowrap}
.q li.running{border-color:var(--accent);background:#fff6ef}
.q li.done .st{color:var(--ok)}.q li.blocked{background:#fdf0ec}.q li.blocked .st{color:#c0392b}
.q li.cancelled{opacity:.55}.q li.hl{outline:2px solid var(--accent)}
.q li button{border:0;background:none;cursor:pointer;font-size:13px;padding:2px 4px;color:var(--muted)}
.confirm{background:#fff7e8;border:1px solid #f0b54a;border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
.saved{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.saved div{display:flex;gap:6px;align-items:center;font-size:14px}.saved div span{flex:1;min-width:0}
.saveform{display:flex;gap:6px;margin-top:6px}.saveform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.story{font-size:17px;line-height:1.7}
.story .s{cursor:pointer;border-radius:4px}.story .s:hover,.story .s.hl{background:#ffe3d1}
.story .s.blocked{text-decoration:line-through;color:var(--muted)}
.story-vi{color:var(--muted);font-size:14px;margin-top:6px}
.story-simple div{padding:2px 0}
.empty2{color:var(--muted);font-size:14px}
.rtabs{display:flex;gap:4px;flex-wrap:wrap}
.rtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.rtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#room{transition:opacity .25s}
.xtabs{display:flex;gap:4px;margin:10px 0 6px;flex-wrap:wrap}
.xlist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.xlist div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.xlist small{color:var(--muted)}
.dlg-list{display:flex;flex-wrap:wrap;gap:6px}
#rpCard>*{max-width:none!important;width:100%!important;box-sizing:border-box}
/* ===== living room redesign ===== */
#char.lie #bob{animation:none;transform:translate(0,-34px) rotate(-90deg) scale(.82)}
#char.lie .legs{transform:none}#char.onsofa>ellipse{opacity:0}
#char.read #arm{transform:rotate(-62deg)}#char.sit.read #upper{transform:translateY(30px) rotate(-4deg)}
#char.pet #arm{animation:petA .45s ease-in-out infinite alternate}@keyframes petA{from{transform:rotate(-38deg)}to{transform:rotate(-72deg)}}
#char.pet:not(.sit):not(.lie) #upper{transform:rotate(16deg)}#char.sit.pet #upper{transform:translateY(30px) rotate(8deg)}
.curtL,.curtR{transition:transform .8s ease}.curtL{transform-origin:404px 0}.curtR{transform-origin:616px 0}
.curt-open .curtL,.curt-open .curtR{transform:scaleX(.3)}
.tieback{opacity:0;transition:opacity .4s}.curt-open .tieback{opacity:1}
.sunbeam{transition:opacity .8s}.liv-dark .sunbeam{opacity:0}
#livDim{transition:opacity .8s}
.lampglow,.lampcone{opacity:0;transition:opacity .5s}.lamp-on .lampglow{opacity:.75}.lamp-on .lampcone{opacity:.28}.lamp-on .lampshade{fill:#fff3cf}
.fanblades{transform-origin:250px 455px}.fan-on .fanblades{animation:spin .35s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.windlines{opacity:0}.fan-on .windlines{opacity:.9;animation:wind 1s ease-in-out infinite}@keyframes wind{50%{transform:translateX(6px);opacity:.3}}
.fan-on .fanled{fill:#3a9d5d}
.notes text{opacity:0}.music-on .notes .n1{animation:note 2.2s ease-out infinite}.music-on .notes .n2{animation:note 2.2s .7s ease-out infinite}.music-on .notes .n3{animation:note 2.2s 1.4s ease-out infinite}
@keyframes note{0%{opacity:0;transform:translate(0,6px)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-30px)}}
.music-on .spkled{fill:#3a9d5d}.music-on #o-speaker .vec>rect:nth-child(2){animation:thump .45s ease-in-out infinite alternate}@keyframes thump{to{transform:translateY(-1px)}}
.throwFolded{display:none}.throw-folded .throwFolded{display:inline}.throw-folded .throwMessy{display:none}
.cushion{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s}.cush-flat .cushion{transform:scale(1.06,.82)}
.cush-fluffy .cushion{animation:fluff .6s ease}@keyframes fluff{40%{transform:scale(1.12,1.18)}70%{transform:scale(.96,.94)}}
#catBowlG .kibble{display:none}.bowl-full #catBowlG .kibble{display:inline}
#catWaterG .water{display:none}.water-full #catWaterG .water{display:inline}
#catPos{transition:transform 1.1s ease-in-out}
#catScale,#catFlip{transition:transform .25s}
#catCurl{display:none;transform-origin:0 0;animation:catbreath 3s ease-in-out infinite}
.cat-sleeping #catCurl{display:inline}.cat-sleeping #catBody{display:none}
@keyframes catbreath{50%{transform:scale(1.03,1.06)}}
#catBody{transform-origin:0 0;animation:catbreath2 2.6s ease-in-out infinite}@keyframes catbreath2{50%{transform:scaleY(1.03)}}
.ctail{transform-origin:-20px -14px;animation:tail 2.2s ease-in-out infinite}@keyframes tail{50%{transform:rotate(-14deg)}}
.ceyes{transform-origin:3px -2px;animation:blink 4.2s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.chead{transform:translate(19px,-27px);transition:transform .3s}
.cat-eating .chead,.cat-drinking .chead{transform:translate(23px,-14px) rotate(28deg);animation:nom .5s ease-in-out infinite alternate}
@keyframes nom{to{transform:translate(23px,-12px) rotate(32deg)}}
.cat-playing #catHop{animation:hop .45s ease-in-out infinite alternate}@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.cat-playing .clegF{transform:rotate(-30deg);transform-origin:14px -12px}
.cat-walk .clegF{animation:catleg .3s ease-in-out infinite alternate}.cat-walk .clegB{animation:catleg .3s ease-in-out infinite alternate-reverse}
.clegF,.clegB{transform-origin:0 -12px}@keyframes catleg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.cat-jump #catHop{animation:jump .9s ease-in-out}@keyframes jump{50%{transform:translateY(-60px)}}
.catZ{opacity:0}.cat-sleeping .catZ{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.catHearts path{opacity:0}.cat-hearts .catHearts .h1{animation:heart 1.3s ease-out infinite}.cat-hearts .catHearts .h2{animation:heart 1.3s .4s ease-out infinite}.cat-hearts .catHearts .h3{animation:heart 1.3s .8s ease-out infinite}
@keyframes heart{0%{opacity:0;transform:translateY(4px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.1)}}
.lamp-on .ceilglow{opacity:.5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>English <span>Life</span> World</h1>
<div class="hud"><span class="stat" id="pts" title="Điểm: có khi học và ôn đúng">⭐ 0</span><span class="stat" id="prog"></span>
<select class="iconbtn" id="langSel" aria-label="Ngôn ngữ dịch" title="Ngôn ngữ dịch"></select><button class="iconbtn" id="btnBook">📒 Sổ từ</button></div></header>
<div id="dayHud" style="max-width:1280px;margin:0 auto 10px;padding:0 16px"></div>
<main>
<div class="leftcol"><section class="scene">
 <div class="scene-bar"><span class="rtabs" id="roomTabs" role="tablist" aria-label="Chọn phòng"></span>
  <span><button class="iconbtn" id="btnTags">🏷 Tên đồ vật</button> <button class="iconbtn" id="btnReset" title="Đưa mọi đồ vật về chỗ cũ">↺ Dọn phòng</button></span></div>
 <svg id="room" viewBox="0 0 1000 640" role="application" aria-label="Căn phòng tương tác">
  <defs>
   <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e6cf"/><stop offset="1" stop-color="#efd6b6"/></linearGradient>
   <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2c29c"/><stop offset="1" stop-color="#ecd2b0"/></linearGradient>
   <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6a676"/><stop offset="1" stop-color="#c28a5a"/></linearGradient>
   <linearGradient id="gFridge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#d5e1ea"/></linearGradient>
   <radialGradient id="gLight" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
   <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g id="shell-living">
  <!-- room shell -->
  <rect x="120" y="0" width="880" height="330" fill="url(#gWall)"/>
  <polygon points="0,0 120,0 120,330 0,640" fill="url(#gLeft)"/>
  <polygon points="120,330 1000,330 1000,640 0,640" fill="url(#gFloor)"/>
  <g stroke="#b77c4d" stroke-opacity=".35">
   <line x1="120" y1="330" x2="0" y2="640"/><line x1="300" y1="330" x2="230" y2="640"/><line x1="480" y1="330" x2="460" y2="640"/><line x1="660" y1="330" x2="690" y2="640"/><line x1="840" y1="330" x2="920" y2="640"/>
  </g>
  <rect x="120" y="318" width="880" height="12" fill="#c99668"/>
  <polygon points="120,318 120,330 0,640 0,600" fill="#b9875a"/>
  <rect x="120" y="0" width="880" height="330" fill="url(#gLight)"/>
  <!-- ===== LIVING ROOM DETAILS (decorative, non-interactive; data-detail) =====
   Shell (wall/floor): 1 skirting-board 2 left-skirting 3 cornice 4 wallpaper-stripes 5 ceiling-light 6 wall-clock 7 picture-landscape
   8 coat-hook 9 jacket 10 hat 11 light-switch 12 power-outlet 13 wall-shelf 14 shelf-photo-family 15 shelf-photo-cat 16 shelf-succulent
   17 shelf-candle 18 air-conditioner 19 kitchen-tiles 20 utensil-rail 21 kitchen-calendar 22 hanging-plant 23 bookshelf 24 books-top
   25 books-middle 26 books-bottom 27 bookshelf-globe 28 sunbeam 29 rug 30 rug-pattern 31 rug-fringe 32 doormat 33 floor-shine
   World: 34 windowsill-plant 35 curtain-rod 36 tv-router 37 game-console 38 dvd-stack 39 fruit-bowl 40 magazine 41 coaster
   42 umbrella-stand 43 umbrellas 44 slippers 45 basket 46 basket-magazines 47 armchair 48 armchair-pillow 49 side-table 50 vase-flowers
   51 cat-bed 52 cat-bed-pillow 53 cat-food-bowl 54 cat-water-bowl 55 yarn-ball 56 cat-mouse-toy 57 sofa-cushions 58 throw-blanket
   59 sofa-seat-cushions 60 lamp-light-cone 61 room-dim 62 music-notes 63 cat-zzz 64 cat-hearts  → 64 details -->
  <g data-detail="skirting-board"><rect x="120" y="314" width="880" height="4" fill="#e7cba6"/></g>

      row.appendChild(b); log.appendChild(row); log.scrollTop = log.scrollHeight;
      return row;
    }
    function stop() {
      token++; if (waiting) { waiting.resolve(false); waiting = null; }
      try { var s = synth(); if (s) s.cancel(); } catch (e) {}
      if (container) container.innerHTML = "";
    }
    function start(scriptId) {
      stop(); var my = token;
      var sc = SCRIPTS.filter(function (s) { return s.id === scriptId; })[0];
      if (!sc || !container) return Promise.resolve(false);
      box = el("div", "dlg-box" + (showVi ? "" : " novi"));
      var head = el("div", "dlg-head", '<span class="dlg-lvl">' + sc.level + '</span><div class="dlg-title">' + esc(sc.title) + "<small>" + esc(sc.titleVi) + '</small></div><button class="dlg-btn dlg-vt">VI</button><button class="dlg-btn dlg-x" aria-label="close">✕</button>');
      head.querySelector(".dlg-vt").onclick = function () { showVi = !showVi; box.classList.toggle("novi", !showVi); };
      head.querySelector(".dlg-x").onclick = stop;
      var log = el("div", "dlg-log"), foot = el("div");
      box.appendChild(head); box.appendChild(log); box.appendChild(foot); container.appendChild(box);
      function alive() { return my === token; }
      function choose(line) {
        return new Promise(function (res) {
          var wrap = el("div", "dlg-choices"), fb = el("div", "dlg-fb");
          line.choices.forEach(function (c) {
            var bt = el("button", "dlg-choice", esc(c.en) + "<small>" + esc(c.vi) + "</small>");
            bt.dataset.correct = c.correct ? "1" : "0";
            bt.onclick = function () {
              if (c.correct) { foot.innerHTML = ""; res(c); }
              else { bt.classList.add("bad"); bt.disabled = true; fb.textContent = "✗ " + (c.feedbackVi || "Chưa đúng, thử lại nhé!"); }
            };
            wrap.appendChild(bt);
          });
          foot.innerHTML = ""; foot.appendChild(wrap); foot.appendChild(fb);
        });
      }
      function act(id) {
        return new Promise(function (res) {
          waiting = { id: id, resolve: res };
          foot.innerHTML = '<div class="dlg-wait">⏳ ' + esc(id.replace(/_/g, " ")) + "…</div>";
          try { enqueue(id); } catch (e) { waiting = null; res(false); }
        });
      }
      return (async function () {
        for (var i = 0; i < sc.lines.length; i++) {
          if (!alive()) return false;
          var line = sc.lines[i];
          if (line.choices) { var c = await choose(line); if (!alive()) return false; line = Object.assign({}, line, { en: c.en, vi: c.vi }); }
          bubble(line, log); onLine(line, i, sc);
          await say(line); if (!alive()) return false;
          if (line.action) {
            var okAct = await act(line.action); if (!alive()) return false;
            foot.innerHTML = ""; log.appendChild(el("div", "dlg-act", (okAct ? "✓ " : "⚠ Không làm được (xem chuỗi hành động): ") + esc(line.action.replace(/_/g, " "))));
          }
        }
        foot.innerHTML = '<div class="dlg-done">🎉 Hoàn thành! Well done!</div>';
        if (o.onDone) o.onDone(sc);
        return true;
      })();
    }
    var api = {
      start: start, stop: stop, meVoice: meVoice,
      actionDone: function (id, ok) { if (waiting && (!id || waiting.id === id)) { var w = waiting; waiting = null; w.resolve(ok !== false); } }
    };
    return api;
  }

  window.ELW_DIALOGUE = { makeMom: makeMom, css: css, SCRIPTS: SCRIPTS, createPlayer: createPlayer,
    ALLOWED_ACTIONS: ["open_fridge","take_milk","put_milk_back","close_fridge","pick_up_cup","put_cup_on_table","pour_milk","drink_from_cup","wipe_table","put_book_on_table","sweep_under_table","pull_out_chair","sit_on_chair","get_up","push_chair_in","sweep_floor","open_window","close_window","water_plant","pick_up_book","turn_on_tv","watch_tv","turn_off_tv"] };
})();

<script>

(function(){

var CAT_VI={furniture:"Nội thất",electronics:"Điện tử",decor:"Trang trí",textiles:"Vải vóc",lighting:"Đèn",items:"Đồ dùng",structure:"Kết cấu",appliances:"Thiết bị"};
var PAGE=24;
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/\s+/g," ").trim();}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function quiz(catalog,n){
  var pool=[],seen={};
  (catalog||[]).forEach(function(c){var k=norm(c.en);if(c&&c.en&&c.vi&&!seen[k]){seen[k]=1;pool.push(c);}});
  if(pool.length<4)return [];
  return shuffle(pool).slice(0,Math.min(n||5,pool.length)).map(function(it){
    var same=shuffle(pool.filter(function(o){return o!==it&&o.category===it.category;}));
    var other=shuffle(pool.filter(function(o){return o!==it&&o.category!==it.category;}));
    var d=same.concat(other).slice(0,3).map(function(o){return o.en;});
    return {id:it.id,prompt_vi:it.vi,answer_en:it.en,options:shuffle(d.concat([it.en]))};
  });
}

var CSS=[

".inv-row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}",

"@media (max-width:420px){.inv-grid{grid-template-columns:1fr 1fr}.inv-qopts{grid-template-columns:1fr}}"
].join("\n");
function injectCSS(){if(document.getElementById("inv-style"))return;var s=document.createElement("style");s.id="inv-style";s.textContent=CSS;document.head.appendChild(s);}

function mount(container,o){
  injectCSS();o=o||{};
  var getCatalog=o.getCatalog||function(){return [];},rooms=o.rooms||[];
  var curRoom=o.currentRoom||function(){return null;},inter=o.interactiveIds||function(){return new Set();};
  var speak=o.speak||function(){},isLearned=o.isLearned||function(){return false;},toggle=o.toggleLearned||function(){},sel=o.onSelectInteractive||function(){};
  var st={open:false,tab:"list",q:"",room:curRoom()||"all",cat:"all",shown:PAGE,quiz:null};
  var card=document.createElement("section");card.className="inv-card";
  container.appendChild(card);

  function filtered(){
    var q=norm(st.q);
    return getCatalog().filter(function(c){
      if(st.room!=="all"&&c.room!==st.room)return false;
      if(st.cat!=="all"&&c.category!==st.cat)return false;
      if(q&&norm(c.en).indexOf(q)<0&&norm(c.vi).indexOf(q)<0)return false;
      return true;
    });
  }
  function chip(kind,val,label,on){return '<button type="button" class="inv-chip" data-'+kind+'="'+esc(val)+'" aria-pressed="'+on+'">'+esc(label)+'</button>';}
  function listHTML(){
    var all=getCatalog(),ids=inter()||new Set();
    var roomCat=all.filter(function(c){return st.room==="all"||c.room===st.room;});
    var cats=[];roomCat.forEach(function(c){if(cats.indexOf(c.category)<0)cats.push(c.category);});
    if(st.cat!=="all"&&cats.indexOf(st.cat)<0)st.cat="all";
    var res=filtered(),page=res.slice(0,st.shown);
    var h='<input class="inv-search" type="search" placeholder="Tìm đồ vật (Anh hoặc Việt)…" aria-label="Tìm đồ vật" value="'+esc(st.q)+'">';
    h+='<div class="inv-chips" role="group" aria-label="Lọc theo phòng">'+chip("room","all","Tất cả",st.room==="all");
    rooms.forEach(function(r){h+=chip("room",r.id,r.nameVi||r.name,st.room===r.id);});
    h+='</div><div class="inv-chips" role="group" aria-label="Lọc theo loại">'+chip("cat","all","Mọi loại",st.cat==="all");
    cats.forEach(function(c){h+=chip("cat",c,CAT_VI[c]||c,st.cat===c);});
    h+='</div><div class="inv-meta" aria-live="polite">'+res.length+' kết quả</div>';
    if(!res.length)return h+'<div class="inv-empty">Không tìm thấy đồ vật nào. Thử từ khác hoặc chọn “Tất cả”.</div>';
    h+='<div class="inv-grid">';
    page.forEach(function(c){
      var L=!!isLearned(c.id),I=ids.has(c.id);
      h+='<div class="inv-tile'+(L?' inv-learned':'')+'" data-id="'+esc(c.id)+'"><div class="inv-en">'+esc(c.en)+'</div><div class="inv-ipa">'+esc(c.ipa)+'</div><div class="inv-vi">'+esc(c.vi)+'</div><div class="inv-row">'+
        '<button type="button" class="inv-btn inv-say" aria-label="Nghe '+esc(c.en)+'">🔊</button>'+
        '<button type="button" class="inv-btn inv-star" aria-pressed="'+L+'" aria-label="Đã thuộc '+esc(c.en)+'" title="Đã thuộc">★</button>'+
        (I?'<button type="button" class="inv-btn inv-go" aria-label="Xem '+esc(c.en)+' trong phòng">▶ Trong phòng</button>':'')+'</div></div>';
    });
    h+='</div>';
    if(res.length>page.length)h+='<button type="button" class="inv-btn inv-more">Xem thêm ('+(res.length-page.length)+')</button>';
    return h;
  }
  function quizHTML(){
    var z=st.quiz;
    if(!z||!z.items.length)return '<div class="inv-empty">Cần ít nhất 4 đồ vật để chơi đố nhanh.</div>';
    if(z.i>=z.items.length)return '<div class="inv-q"><div class="inv-qprompt">Bạn được '+z.score+'/'+z.items.length+' 🎉</div><button type="button" class="inv-btn inv-qnew">Chơi lại</button></div>';
    var it=z.items[z.i];
    var h='<div class="inv-q"><div class="inv-meta">Chọn từ tiếng Anh cho:</div><div class="inv-qprompt">'+esc(it.prompt_vi)+'</div><div class="inv-qopts">';
    it.options.forEach(function(op,k){
      var cls="";if(z.picked!=null){if(op===it.answer_en)cls=" inv-right";else if(k===z.picked)cls=" inv-wrong";}
      h+='<button type="button" class="inv-btn inv-qopt'+cls+'" data-k="'+k+'"'+(z.picked!=null?' aria-disabled="true"':'')+'>'+esc(op)+'</button>';
    });
    h+='</div><div class="inv-qfoot"><span>Câu '+(z.i+1)+'/'+z.items.length+' · Điểm: <b class="inv-score">'+z.score+'</b></span>';
    if(z.picked!=null)h+='<span><button type="button" class="inv-btn inv-qsay">🔊 '+esc(it.answer_en)+'</button> <button type="button" class="inv-btn inv-go inv-qnext">Tiếp →</button></span>';
    return h+'</div></div>';
  }
  function newQuiz(){var pool=getCatalog().filter(function(c){return st.room==="all"||c.room===st.room;});if(pool.length<4)pool=getCatalog();st.quiz={items:quiz(pool,10),i:0,score:0,picked:null};}
  function render(focusSel){
    var n=getCatalog().length;
    card.className="inv-card"+(st.open?" inv-open":"");
    var h='<button type="button" class="inv-head" aria-expanded="'+st.open+'"><span>🧺 Kho đồ ('+n+' món)</span><span class="inv-chev" aria-hidden="true">›</span></button><div class="inv-body">';
    h+='<div class="inv-tabs" role="tablist"><button type="button" role="tab" class="inv-tab" data-tab="list" aria-selected="'+(st.tab==="list")+'">📋 Danh sách</button><button type="button" role="tab" class="inv-tab" data-tab="quiz" aria-selected="'+(st.tab==="quiz")+'">🎯 Đố nhanh</button></div>';
    h+=(st.tab==="list"?listHTML():quizHTML())+'</div>';

    if(focusSel){var f=card.querySelector(focusSel);if(f){f.focus();if(f.setSelectionRange&&f.value!=null){var l=f.value.length;try{f.setSelectionRange(l,l);}catch(e){}}}}
  }
  function keyOf(el){ // stable selector to restore focus after re-render
    if(el.classList.contains("inv-search"))return ".inv-search";
    if(el.dataset.room)return '[data-room="'+el.dataset.room+'"]';
    if(el.dataset.cat)return '[data-cat="'+el.dataset.cat+'"]';
    if(el.dataset.tab)return '[data-tab="'+el.dataset.tab+'"]';
    var t=el.closest(".inv-tile");if(t)return '.inv-tile[data-id="'+t.dataset.id+'"] .'+el.className.split(" ").filter(function(c){return c!=="inv-btn";})[0];
    return null;
  }
  card.addEventListener("input",function(e){if(e.target.classList.contains("inv-search")){st.q=e.target.value;st.shown=PAGE;render(".inv-search");}});
  card.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var tile=b.closest(".inv-tile"),id=tile&&tile.dataset.id;
    if(b.classList.contains("inv-head")){st.open=!st.open;render(".inv-head");return;}
    if(b.dataset.tab){st.tab=b.dataset.tab;if(st.tab==="quiz"&&!st.quiz)newQuiz();render(keyOf(b));return;}
    if(b.dataset.room){st.room=b.dataset.room;st.shown=PAGE;render(keyOf(b));return;}
    if(b.dataset.cat){st.cat=b.dataset.cat;st.shown=PAGE;render(keyOf(b));return;}
    if(b.classList.contains("inv-more")){var prev=st.shown;st.shown+=PAGE;render();var t=card.querySelectorAll(".inv-tile")[prev];if(t)t.querySelector("button").focus();return;}
    if(b.classList.contains("inv-say")){var it=getCatalog().find(function(c){return c.id===id;});if(it)speak(it.en);return;}
    if(b.classList.contains("inv-star")){toggle(id);render(keyOf(b));return;}
    if(b.classList.contains("inv-go")&&id){sel(id);return;}
    var z=st.quiz;
    if(b.classList.contains("inv-qopt")&&z&&z.picked==null){var k=+b.dataset.k,q=z.items[z.i];z.picked=k;if(q.options[k]===q.answer_en)z.score++;speak(q.answer_en);render(".inv-qnext");return;}
    if(b.classList.contains("inv-qsay")){speak(z.items[z.i].answer_en);return;}
    if(b.classList.contains("inv-qnext")){z.i++;z.picked=null;render(z.i>=z.items.length?".inv-qnew":".inv-qopt");return;}
    if(b.classList.contains("inv-qnew")){newQuiz();render(".inv-qopt");return;}
  });
  render();
  return {
    refresh:function(){var a=document.activeElement,k=card.contains(a)?keyOf(a):null;render(k);},
    open:function(){st.open=true;render();},
    close:function(){st.open=false;render();},
    setRoom:function(r){st.room=r||"all";st.shown=PAGE;render();}
  };
}
var api={mount:mount,quiz:quiz,normalize:norm};
if(typeof window!=="undefined")window.ELW_INVENTORY=api;
if(typeof module!=="undefined"&&module.exports)module.exports=api;
})();

  const h = ((Number(hour) % 24) + 24) % 24;
  if (h >= 5 && h < 11) return "morning";
  if (h >= 11 && h < 17) return "noon";
  if (h >= 17 && h < 22) return "evening";
  return "night";
}

function suggest(lastActionId, W, opts) {
  W = W || {}; opts = opts || {};
  const can = typeof opts.isPossible === "function" ? opts.isPossible : () => true;
  const max = Math.min(3, opts.max || 3);
  const hour = opts.hour != null ? opts.hour : new Date().getHours();
  const out = [], seen = new Set([lastActionId]);
  const push = (id, why_vi) => {
    if (out.length >= max || seen.has(id) || !NEXT[id]) return;
    let ok = false; try { ok = !!can(id); } catch (e) { ok = false; }
    if (!ok) return; seen.add(id); out.push({ id, why_vi });
  };
  const cands = (NEXT[lastActionId] || []).filter(e => { try { return !e.when || e.when(W); } catch (x) { return false; } })
    .sort((a, b) => (b.weight || 1) - (a.weight || 1));
  cands.forEach(e => push(e.id, e.why_vi));
  // unguarded entries whose guard failed are skipped; fall back to time-of-day + routines
  const tod = timeOfDay(hour);
  if (out.length < max) TIME_IDS[tod].forEach(id => push(id, TIME_WHY[tod]));
  if (out.length < max) ROUTINES.filter(r => r.time === tod).concat(ROUTINES).forEach(r => r.ids.forEach(id => push(id, "Một bước trong “" + r.titleVi + "”.")));
  return out;
}

}

  rule("past-marker", "tense", new RegExp(`\\b(${SUBJ3}|I|you|we|they) (don't|doesn't|am|is|are|have|has|[a-z]+)\\b`, "i"),

  /* ---------------- engine ---------------- */
  function applyRule(r, sentence, ctx, issues) {
    let out = sentence, guard = 0, from = 0;
    const re = new RegExp(r.re.source, r.re.flags.replace("g", "") + "g");
    while (guard++ < 10) {

      out = out.slice(0, m.index) + rep + out.slice(m.index + m[0].length);
      issues.push({ id: r.id, type: r.type, from: m[0].trim(), to: rep.trim(), msg_vi: r.msg, example_en: r.ex });
      from = m.index + rep.length;

  function splitSentences(text) { return String(text).match(/(?:\b[ap]\.m\.|[^.!?])+[.!?]*|[.!?]+/gi) || []; }

  function check(text) {
    const original = String(text == null ? "" : text);
    const issues = [];
    const parts = splitSentences(original.replace(/[’‘]/g, "'"));
    const outParts = parts.map(part => {
      const lead = part.match(/^\s*/)[0];
      let s = part.slice(lead.length).replace(/\s+$/, ""); const trail = part.slice(lead.length + s.length);
      if (!s.trim()) return part;
      const abbr = /\b[ap]\.m\.$/i.test(s); const punct = abbr ? "" : (s.match(/[.!?]+$/) || [""])[0];
      let body = s.slice(0, s.length - punct.length).replace(/\s{2,}/g, " ");
      const ctx = { past: PAST_MARK.test(body), q: punct.includes("?") || (!punct && isQuestionStart(body)) };
      for (const r of R) body = applyRule(r, body, ctx, issues);
      let end = punct;
      if (!end && !abbr) { end = isQuestionStart(body) ? "?" : "."; issues.push({ id: "end-punct", type: "punctuation", from: body.split(" ").slice(-1)[0] || "", to: (body.split(" ").slice(-1)[0] || "") + end, msg_vi: "Câu cần có dấu kết thúc: dấu chấm (.) hoặc dấu hỏi (?).", example_en: "I am hungry." }); }
      return lead + body + end + trail;

    const g = issues.filter(i => i.type !== "punctuation").length, p = issues.length - g;
    const score = original.trim() ? Math.max(0, 100 - g * 15 - p * 4) : 0;
    return { original, corrected, issues, score };

  const ELW_GRAMMAR = { check, RULES: R.map(r => ({ id: r.id, type: r.type, msg_vi: r.msg, example_en: r.ex })).concat([{ id: "end-punct", type: "punctuation" }]), forms: { s3, past, pp, ing } };

  /* ================= Mistakes notebook ================= */
  const KEY = "elw_mistakes_v1";
  let mem = { v: 1, items: [] };
  const TYPE_VI = { grammar: "Ngữ pháp", "word-choice": "Dùng từ", tense: "Thì", article: "Mạo từ", preposition: "Giới từ", plural: "Số nhiều", agreement: "Hòa hợp chủ–vị", "word-order": "Trật tự từ", punctuation: "Dấu câu", naturalness: "Tự nhiên" };

  function load() {
    try { const ls = root.localStorage; if (!ls) return mem; const d = JSON.parse(ls.getItem(KEY) || "null"); if (d && d.v === 1 && Array.isArray(d.items)) mem = d; } catch (e) { /* ignore */ }
    return mem;
  }
  function save() { try { if (root.localStorage) root.localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* quota / private mode */ } }
  const uid = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function add(res, context) {
    load();
    if (typeof res === "string") res = check(res);
    if (!res || !Array.isArray(res.issues)) return [];
    const added = [];
    const gi = res.issues.filter(i => i.type !== "punctuation");
    const list = gi.length ? gi : res.issues;
    for (const is of list) {
      const key = (is.id + "|" + String(is.from).toLowerCase());
      let it = mem.items.find(x => x.key === key);
      if (it) { it.count++; it.ts = Date.now(); it.wrong = res.original; it.right = res.corrected; }
      else { it = { id: uid(), key, rule: is.id, type: is.type, from: is.from, to: is.to, msg_vi: is.msg_vi, example_en: is.example_en, wrong: String(res.original).trim(), right: res.corrected, context: context || "", count: 1, ts: Date.now() }; mem.items.unshift(it); }
      added.push(it);
    }
    if (mem.items.length > 300) mem.items.length = 300;

  }
  function list() { return load().items.slice(); }
  function remove(id) { load(); const n = mem.items.length; mem.items = mem.items.filter(x => x.id !== id); save(); return mem.items.length !== n; }
  function clear() { mem = { v: 1, items: [] }; save(); }
  function stats() {
    const items = list(); const byType = {};
    items.forEach(i => { byType[i.type] = (byType[i.type] || 0) + i.count; });
    const top = items.slice().sort((a, b) => b.count - a.count || b.ts - a.ts).slice(0, 5).map(i => ({ id: i.id, rule: i.rule, type: i.type, from: i.from, to: i.to, count: i.count }));

  function shuffle(a, seed) { a = a.slice(); let x = seed || 7; for (let i = a.length - 1; i > 0; i--) { x = (x * 9301 + 49297) % 233280; const j = Math.floor(x / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function practice(n) {
    n = n || 5; const items = list().sort((a, b) => b.count - a.count || b.ts - a.ts);
    const out = [];
    for (let k = 0; k < Math.min(n, items.length * 3) && out.length < n; k++) {
      const it = items[k % items.length]; const kind = ["fix-the-sentence", "choose-correct", "fill-gap"][(k + Math.floor(k / items.length)) % 3];
      if (kind === "fix-the-sentence") out.push({ type: kind, itemId: it.id, prompt_vi: "Sửa lại câu sau cho đúng:", wrong: it.wrong, answer: it.right, hint_vi: it.msg_vi });
      else if (kind === "choose-correct") {
        const alt = it.right.replace(it.to, it.from) === it.right ? it.wrong + "" : it.right.replace(it.to, it.from);
        const opts = Array.from(new Set([it.right, it.wrong, alt, it.wrong.replace(/[.!?]?$/, "") === it.wrong ? it.wrong + "." : it.wrong.replace(/[.!?]$/, "")])).slice(0, 3);

      } else {
        const idx = it.right.indexOf(it.to);
        if (idx < 0) { out.push({ type: "fix-the-sentence", itemId: it.id, prompt_vi: "Sửa lại câu sau cho đúng:", wrong: it.wrong, answer: it.right, hint_vi: it.msg_vi }); continue; }
        const gap = it.right.slice(0, idx) + "____" + it.right.slice(idx + it.to.length);
        out.push({ type: kind, itemId: it.id, prompt_vi: "Điền vào chỗ trống: " + gap, wrong: it.wrong, gap, answer: it.to, options: shuffle([it.to, it.from], k), hint_vi: it.msg_vi });

  const norm = s => String(s || "").toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'\s]/g, " ").replace(/\s+/g, " ").trim();

  function renderBook(container, opts) {
    if (!container) return null; opts = opts || {};
    const doc = container.ownerDocument || root.document;
    if (doc && !doc.getElementById("gm-css")) { const st = doc.createElement("style"); st.id = "gm-css"; st.textContent = css; doc.head.appendChild(st); }
    const speak = opts.speak || (t => { try { const u = new root.SpeechSynthesisUtterance(t); u.lang = "en-US"; root.speechSynthesis.cancel(); root.speechSynthesis.speak(u); } catch (e) { } });
    let filter = "all", quiz = null;

      container.innerHTML = `<div class="gm-head"><h3>📒 Sổ lỗi của tôi</h3><span class="gm-stat">${st.total} lỗi · ${st.occurrences} lần mắc${st.mostType ? " · hay sai nhất: <b>" + esc(TYPE_VI[st.mostType] || st.mostType) + "</b>" : ""}</span></div>

  function norm(s) {

  const dur=reduceMotion?1:dist/0.45;const t0=performance.now();
  await new Promise(res=>{function f(now){if(tk!==token)return res();const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
   W.x=sx+(p.x-sx)*e;W.y=sy+(p.y-sy)*e;placeChar();k<1?requestAnimationFrame(f):res()}requestAnimationFrame(f)});alive(tk)}}
 finally{charG.classList.remove("walk")}
 W.dir=spot.d||W.dir;placeChar();
}
const POSES=["reach","bend","drink","pour","sweep","wipe","water","point","read","pet"];
// Tư thế tay/thân là một lớp riêng: không xoá trạng thái ngồi, cầm cốc hay xem TV
async function pose(name,ms){POSES.forEach(p=>charG.classList.remove(p));charG.classList.remove("idle");
 if(name==="idle"){charG.classList.add("idle");return}charG.classList.add(name);await sleep(reduceMotion?Math.min(ms,150):ms*0.8)}

/* ---------- chạy các bước của một hành động (có thể huỷ an toàn) ---------- */
async function runSeq(steps,tk){
 for(const s of steps){alive(tk);const [op,a,b]=s;
  if(op==="walk")await moveTo(SPOTS[a],tk);
  else if(op==="pose")await pose(a,b);
  else if(op==="wait")await sleep(reduceMotion?50:a*0.8);
  else if(op==="set"){W[a]=b;applyState()}
  else if(op==="take"){W[a]="hand";W.hand=a;applyState()}
  else if(op==="place"){W[a]=b;W.hand=null;applyState()}
  else if(op==="spawn"){const g=makeTemp(a);handG.appendChild(g);await sleep(120)}
  else if(op==="despawn"){handG.querySelectorAll(".temp").forEach(e=>e.remove())}
  else if(op==="sit"){W.sitting=true;W.dir=-1;applyState();await sleep(400)}
  else if(op==="stand"){W.sitting=false;W.activity=null;if(W.room==="living"){const fromSofa=!!W.sofa;W.sofa=null;applyState();if(fromSofa){W.x=SPOTS.sofaFront.x;W.y=SPOTS.sofaFront.y}else{W.x=CHAIR_X[W.chair]+70;W.y=545}}else{if("b_lying" in W)W.b_lying=false;applyState();W.y=Math.min(625,W.y+18)}placeChar();await sleep(250)}
  else if(op==="room"){await switchRoom(a,tk)}
  else if(op==="sip"){W.cupLevel=Math.max(0,W.cupLevel-1);applyState()}
  else if(op==="face"){const t=SPOTS[a];if(t)W.dir=t.x<W.x?-1:1;placeChar()}
  else if(op==="activity"){W.activity=a;applyState()}
  else if(op==="fx"){if(a==="clean"){room.classList.remove("dusty")}else if(a==="shine"){const t=$id("o-table");t.classList.remove("shine");void t.getBBox();t.classList.add("shine")}
   else if(a==="watering"){$id("o-plant").classList.add("watering");await sleep(b||1000);$id("o-plant").classList.remove("watering")}}
 }
}
function makeTemp(name){const g=document.createElementNS(SVGNS,"g");g.classList.add("temp");g.innerHTML=PROP_SVG[name];g.setAttribute("transform","translate(0,10)");return g}

/* =====================================================================
   4b. BỘ ĐIỀU PHỐI CHUỖI HÀNH ĐỘNG
   Mỗi mục: pending → running → done | blocked | cancelled.
   Điều kiện được kiểm tra đúng lúc tới lượt (theo trạng thái thật của phòng).
   ===================================================================== */
let queue=[],paused=false,pumping=false,uidN=1,hlUid=null;
let running=false; // đang chạy một hành động
const mkItem=id=>({uid:uidN++,id,status:"pending",why:"",ctx:null,auto:false});
function enqueue(id){if(paused&&!queue.some(q=>q.status==="pending"))paused=false;queue.push(mkItem(id));renderSeq();if(!paused)pump()}
async function pump(){
 if(pumping)return;pumping=true;const tk=token;
 try{while(!paused&&tk===token){const it=queue.find(q=>q.status==="pending");if(!it)break;await execItem(it,tk)}}
 catch(e){if(!(e instanceof Abort))console.error(e)}
 finally{pumping=false;running=false;document.body.classList.remove("running");renderSeq();renderStory();if(selObj&&!cur)renderObject();
  if(tk===token&&!queue.some(q=>q.status==="pending")&&narr.mode==="after"&&queue.some(q=>q.status==="done"))speakStory();
  if(tk===token&&!queue.some(q=>q.status==="pending"))try{afterQueueIdle()}catch(e){console.error(e)}}
}
async function execItem(it,tk){
 const a=ACT[it.id];
 // cần đứng mà đang ngồi → chèn "Get up" thật vào chuỗi (để đoạn văn đúng sự thật)
 const needTravel=a.room&&a.room!=="*"&&a.room!==W.room;
 if(W.sitting&&(needTravel||(!SIT_OK.has(a.id)&&!a.pre()))){const g=mkItem("get_up");g.auto=true;queue.splice(queue.indexOf(it),0,g);await execItem(g,tk);alive(tk)}
 if(a.room&&a.room!=="*"&&a.room!==W.room){const g=mkItem("go_"+a.room);g.auto=true;queue.splice(queue.indexOf(it),0,g);await execItem(g,tk);alive(tk)}
 const why=a.pre();
 if(why){it.status="blocked";it.why=why;renderSeq();renderStory();toastG(`Không làm được “${a.label}”: ${why}`);if(dlgPlayer&&!it.auto)dlgPlayer.actionDone(it.id,false);if(rpPlayer&&!it.auto)rpPlayer.actionDone(it.id,false);return}
 it.status="running";running=true;document.body.classList.add("running");
 it.ctx={watching:W.activity==="watching",sitting:W.sitting,cupLevel:W.cupLevel,milkFromFridge:W.milk==="fridge"};
 renderSeq();if(selObj&&!cur)renderObject();
 narrate(a); // giọng đọc bắt đầu cùng lúc với chuyển động, không chờ
 try{await runSeq(a.seq(),tk);it.status="done";if(!it.auto&&!a.id.startsWith("go_"))lastDone=a.id;try{onWorldAction(it,a)}catch(e){console.error(e)}
  if(W.activity!=="watching"&&!W.sitting)await pose("idle");else if(!charG.classList.contains("idle"))pose("idle");
 }catch(e){if(e instanceof Abort){it.status="cancelled"}throw e}
 finally{renderSeq();renderStory();if(dlgPlayer&&!it.auto&&(it.status==="done"||it.status==="blocked"))dlgPlayer.actionDone(it.id,it.status==="done");if(rpPlayer&&!it.auto&&(it.status==="done"||it.status==="blocked"))rpPlayer.actionDone(it.id,it.status==="done")}
}
function resetScene(){
 token++;speechStop();
 queue.forEach(q=>{if(q.status==="running")q.status="cancelled"});paused=true;running=false;
 const keep={x:W.x,y:W.y,dir:W.dir};W={...W0,...keep};
 handG.querySelectorAll(".temp").forEach(e=>e.remove());room.classList.add("dusty");POSES.forEach(p=>charG.classList.remove(p));
 if(typeof renderRoom==="function")renderRoom();
 applyState();pose("idle");if(selObj&&!cur)renderObject();renderSeq();renderStory();
}
/* =====================================================================
   5. TIẾN ĐỘ + SRS (giữ nguyên dữ liệu & thuật toán bản trước)
   ===================================================================== */
const KEY="elw_progress_v1";
let P={};try{P=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
if(!P.items){P={steps:Object.fromEntries(Object.entries(P).map(([k,v])=>[k,v.steps||{}])),items:{},pts:0}}
P.steps=P.steps||{};P.pts=P.pts||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const HOUR=36e5,SRS_HOURS=[0,4,8,23,47,167,335,719,2879],DONE=9,KNOWN=5;
const LABELS=["Chưa học","Mới học","Mới học","Mới học","Mới học","Đã thuộc","Đã thuộc","Nhớ lâu","Khắc sâu","Thành thạo"];
const stageColor=s=>s<=0?"#ddd":s<KNOWN?"#e8a25a":s<7?"#5e9a6f":s<DONE?"#3f7fa8":"#8a6bb3";
const PTS={step:1,learn:5,ok:3,hint:1};
const ivl=s=>SRS_HOURS[Math.max(1,Math.min(s,8))]*HOUR;
const stage=id=>P.items[id]?P.items[id].s:0;
function addPts(n){P.pts+=n;const e=$id("pts");e.textContent="⭐ "+P.pts;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
function learn(id){if(P.items[id])return;P.items[id]={s:1,due:Date.now()+ivl(1),ok:0,bad:0};addPts(PTS.learn);toastG(`Đã thêm “${ACT[id].sentence}” vào lịch ôn. +${PTS.learn}⭐`)}
function review(id,grade){const it=P.items[id],now=Date.now();
 if(grade==="ok"){it.s=Math.min(DONE,it.s+1);it.due=it.s>=DONE?0:now+ivl(it.s);it.ok++;addPts(PTS.ok)}
 else if(grade==="hint"){it.due=now+ivl(1);it.bad++;addPts(PTS.hint)}
 else{it.s=Math.max(1,it.s-(it.s>=KNOWN?2:1));it.due=now+ivl(it.s);it.bad++}
 save();refresh()}
const dueList=()=>Object.keys(P.items).filter(id=>ACT[id]&&P.items[id].s<DONE&&P.items[id].due<=Date.now()).sort((a,b)=>P.items[a].due-P.items[b].due);
function nextDue(){let b=0;for(const id in P.items){const it=P.items[id];if(ACT[id]&&it.s<DONE&&(!b||it.due<b))b=it.due}return b}
function fmtWait(ms){const h=ms/HOUR;return h<1?Math.max(1,Math.round(ms/6e4))+" phút":h<24?Math.round(h)+" giờ":Math.round(h/24)+" ngày"}
function mark(id,step){P.steps[id]=P.steps[id]||{};if(!P.steps[id][step]){P.steps[id][step]=true;addPts(PTS.step)}
 if(step==="recall")learn(id);save();refresh()}
function refresh(){
 const done=ACTIONS.filter(a=>stage(a.id)>0).length;
 $id("prog").textContent=`✅ ${done}/${ACTIONS.length}`;$id("pts").textContent="⭐ "+P.pts;updateGuide();
}

let guideAct=null,gTimer;
function updateGuide(){const t=$id("guideText"),due=dueList(),fresh=ACTIONS.find(a=>a.room===W.room&&!stage(a.id)&&!a.pre());if(pumping){t.textContent="Đang chạy chuỗi hành động… bạn có thể chọn thêm hành động.";return}
 if(due.length){t.textContent=`Hôm nay có ${due.length} câu cần ôn. Ôn ngay để không quên nhé!`;guideAct=startReview}
 else if(fresh){t.textContent=`Thử hành động mới: “${fresh.label}” (${fresh.labelVi}).`;guideAct=()=>{selectObject(fresh.obj);enqueue(fresh.id)}}
 else{const n=nextDue();t.textContent=n?`Giỏi lắm! Lượt ôn tiếp theo sau ${fmtWait(n-Date.now())}. Bấm ↺ Dọn phòng để làm lại các hành động.`:"Bạn đã thành thạo tất cả! 🎉";guideAct=openBook}}

let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));voice=v.find(v=>/en-US/.test(v.lang))||v[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate=1){if(window.ELW_VOICES)return ELW_VOICES.speak(t,narr.voice||"adult_female",{rate});return new Promise(r=>{if(!("speechSynthesis" in window)){toastG("Trình duyệt không hỗ trợ phát âm.");return r()}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;u.onend=r;u.onerror=r;speechSynthesis.speak(u);setTimeout(r,8000)})}
let rec=null,chunks=[],myUrl=null;
function setupRec(btn,pbtn,res){
 if(!navigator.mediaDevices||!window.MediaRecorder){btn.disabled=true;res.textContent="Trình duyệt không hỗ trợ thu âm. Hãy nhại theo to lên.";return}
 btn.onclick=async()=>{if(rec&&rec.state==="recording"){rec.stop();return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());myUrl=URL.createObjectURL(new Blob(chunks));pbtn.disabled=false;btn.textContent="⏺ Thu lại";res.textContent="Đã thu xong. Nghe giọng bạn rồi nghe giọng mẫu."};
   rec.start();btn.textContent="⏹ Dừng";res.textContent="Đang thu… nói: "+cur.sentence;
  }catch(e){res.textContent="Không mở được micro. Kiểm tra quyền truy cập micro."}};
 pbtn.onclick=()=>myUrl&&new Audio(myUrl).play();
}
function norm(s){return s.toLowerCase().replace(/i am/g,"i'm").replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean)}
function listenTo(target,out,cb){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){out.innerHTML="Trình duyệt chưa hỗ trợ nhận diện giọng nói (dùng Chrome/Edge). Hãy tự nói rồi tự đánh giá.";return}
 const r=new SR();r.lang="en-US";r.interimResults=false;out.textContent="🎙 Đang nghe…";
 r.onresult=e=>{const said=e.results[0][0].transcript,a=norm(said),b=norm(target);
  const pct=Math.round(b.filter(w=>a.includes(w)).length/b.length*100),miss=b.filter(w=>!a.includes(w));
  out.innerHTML=`Máy nghe được: “<i>${said}</i>”<br>Khớp: <b class="${pct>=75?"good":"bad"}">${pct}%</b>`+(miss.length?` — thiếu/sai: ${miss.map(w=>`<b>${w}</b>`).join(", ")}`:"")+(pct>=75?"":" — thử lại nhé!");cb&&cb(pct)};
 r.onerror=e=>out.textContent="Không nghe rõ ("+e.error+"). Thử lại hoặc kiểm tra micro.";r.start();
}

/* Action log (sự kiện thật) → đoạn văn (biên tập). Đoạn văn KHÔNG bao giờ được dùng làm trạng thái. */
const VI_CONN={First:"Đầu tiên,",Then:"Sau đó,",Next:"Tiếp theo,","After that":"Sau đó nữa,",Finally:"Cuối cùng,",While:"Trong lúc xem ti vi,",Every:"Thỉnh thoảng,"};
function vpOf(it,rich){const d=STORY[it.id];if(!d)return[ACT[it.id].label.toLowerCase(),ACT[it.id].labelVi.toLowerCase()];
 let en=rich?d[1]:d[0];
 if(it.id==="pour_milk"&&rich&&!it.ctx.milkFromFridge)en="slowly pour milk into the cup"; // chỉ nói "cold" khi sữa vừa lấy từ tủ lạnh
 return[en,d[2]]}
function buildStory(){
 const done=queue.filter(q=>q.status==="done");if(!done.length)return[];
 if(narr.storyMode!=="simple"&&window.ELW_LEVELS){if(!/^[ABC][12]$/.test(narr.storyMode))narr.storyMode="A2";
  return ELW_LEVELS.build(done.map(q=>({uid:q.uid,id:q.id,ctx:q.ctx||{}})),narr.storyMode,{rich:narr.rich,fallback:id=>STORY[id]?[STORY[id][narr.rich?1:0],STORY[id][2]]:null})}
 if(narr.storyMode==="simple")return done.map(it=>{const [en,vi]=vpOf(it,false);return{uids:[it.uid],en:`I ${en}.`,vi:`Tôi ${vi}.`}});
 // gom thành mệnh đề: hành động trong lúc xem TV đứng riêng; còn lại ghép từng cặp bằng "and"
 const cl=[];
 for(const it of done){const special=it.ctx.watching&&it.id==="drink_from_cup";const last=cl[cl.length-1];
  if(!special&&last&&!last.special&&last.items.length<2&&it.id!=="watch_tv"&&last.items[0].id!=="watch_tv")last.items.push(it);
  else cl.push({special,items:[it]})}
 let sipWhile=0;
 return cl.map((c,k)=>{const n=cl.length;let pre,preVi;
  if(c.special){pre=sipWhile++?"Every now and then, I":"While I'm watching TV, I";preVi=VI_CONN[sipWhile>1?"Every":"While"]}
  else if(n===1){pre="I";preVi=""}
  else if(k===0){pre="First, I";preVi=VI_CONN.First}
  else if(k===n-1){pre="Finally, I";preVi=VI_CONN.Finally}
  else{const w=["Then","Next","After that"][(k-1)%3];pre=w+", I";preVi=VI_CONN[w]}
  const parts=c.items.map(it=>vpOf(it,narr.rich));
  const vi=(preVi?preVi+" tôi ":"Tôi ")+parts.map(p=>p[1]).join(" và ")+".";
  return{uids:c.items.map(i=>i.uid),en:`${pre} ${parts.map(p=>p[0]).join(" and ")}.`,vi}});
}
/* ---------- Ngôi kể (I / He / She / tên) + thì (hiện tại / quá khứ) ----------
   Biến đổi trên câu đã ghép: chủ ngữ "I" → người khác, chia lại động từ chính theo ngôi và thì. */
const POV={i:{en:"I",poss:"my",refl:"myself",obj:"me",vi:"tôi"},he:{en:"he",pron:"he",poss:"his",refl:"himself",obj:"him",vi:"anh ấy"},she:{en:"she",pron:"she",poss:"her",refl:"herself",obj:"her",vi:"cô ấy"},
 tom:{en:"Tom",pron:"he",poss:"his",refl:"himself",obj:"him",vi:"Tom"},anna:{en:"Anna",pron:"she",poss:"her",refl:"herself",obj:"her",vi:"Anna"}};
const IRR={be:"was",go:"went",do:"did",have:"had",make:"made",take:"took",put:"put",get:"got",sit:"sat",set:"set",drink:"drank",eat:"ate",sweep:"swept",hang:"hung",lie:"lay",
 read:"read",spread:"spread",find:"found",bring:"brought",hold:"held",leave:"left",wake:"woke",feed:"fed",sleep:"slept",buy:"bought",keep:"kept",begin:"began",choose:"chose",
 wear:"wore",see:"saw",sink:"sank",swing:"swung",draw:"drew",throw:"threw",rise:"rose",shut:"shut",cut:"cut",run:"ran",lay:"laid",unwind:"unwound",give:"gave",come:"came",
 shake:"shook",stand:"stood",fall:"fell",feel:"felt",think:"thought",say:"said",tell:"told",know:"knew",grow:"grew",light:"lit",spend:"spent",send:"sent",catch:"caught",fry:"fried",dry:"dried",empty:"emptied"};
const DOUBLE=new Set(["stop","plug","unplug","grab","drop","step","sip","slip","mop","nod","rub","wrap","chop","pat","tap","hug","drag","jog","plan","shop","pop","scrub"]);
const VERBS=new Set(["open","close","take","put","pick","pour","drink","wipe","clean","sweep","pull","push","sit","get","water","turn","watch","switch","settle","sink","ease","give",
 "set","fill","tuck","return","grab","lift","run","lay","place","swing","fish","slip","nudge","shut","rise","draw","throw","retrieve","flick","unwind","nurse","stop","make",
 "hang","lie","read","spread","eat","find","bring","hold","leave","wake","go","walk","plug","unplug","cut","fry","dry","empty","shake","feed","sleep","buy","keep","begin","choose",
 "wear","see","do","boil","cook","wash","serve","heat","toast","brew","check","look","brush","fold","fluff","charge","rinse","relax","carry","sip","smile","enjoy","finish",
 "start","sweep","press","stir","scrub","chop","add","use","leave","move","help","switch","plug","toss","pack","tidy","straighten","put","set","sink","settle","ease"]);
["pet","fluff","fold","lie","stretch","call","play","listen","feed","brush","sink"].forEach(v=>VERBS.add(v));DOUBLE.add("pet");
const ADV=/^(\w+ly|also|then|still|always|just|now|again|soon)$/i;
function third(v){if(v==="have")return"has";if(v==="do")return"does";if(v==="go")return"goes";if(/(s|sh|ch|x|z|o)$/.test(v))return v+"es";if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+"ies";return v+"s"}
function past(v){if(IRR[v])return IRR[v];if(/e$/.test(v))return v+"d";if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+"ied";if(DOUBLE.has(v))return v+v.slice(-1)+"ed";return v+"ed"}
function conj(v,pv,tense){const low=v.toLowerCase();if(!VERBS.has(low)&&!IRR[low])return null;return tense==="past"?past(low):(pv==="i"?low:third(low))}
function povEn(text,pv,tense,ctx){ctx=ctx||{sent:0};if(pv==="i"&&tense!=="past")return text;const P=POV[pv];
 // dạng rút gọn / trợ động từ đi với I
 text=text.replace(/\bI'm\b/g,tense==="past"?`${P.en} was`:(pv==="i"?"I'm":`${P.en} is`))
  .replace(/\bI've\b/g,tense==="past"?`${P.en} had`:(pv==="i"?"I've":`${P.en} has`))
  .replace(/\bI have\b/g,tense==="past"?`${P.en} had`:(pv==="i"?"I have":`${P.en} has`))
  .replace(/\bI am\b/g,tense==="past"?`${P.en} was`:`${P.en} is`);
 const tk=text.split(/(\s+|[,.;!?])/);let subj=false,chain=false,usedName=ctx.sent%2===1;
 for(let i=0;i<tk.length;i++){const w=tk[i];if(!w||/^\s+$/.test(w))continue;
  if(/^[,.;!?]$/.test(w)){if(w!==","){chain=false;ctx.sent++;usedName=ctx.sent%2===1}subj=false;continue}
  if(w==="I"){tk[i]=(P.pron&&usedName)?P.pron:P.en;usedName=true;subj=true;continue}
  if(subj){if(ADV.test(w))continue;const c=conj(w,pv,tense);if(c){tk[i]=c;chain=true}subj=false;continue}
  if(chain&&w==="and"){let j=i+1;while(j<tk.length&&(!tk[j]||/^\s+$/.test(tk[j])||ADV.test(tk[j])))j++;
   if(j<tk.length){const c=conj(tk[j],pv,tense);if(c&&!/ing$/.test(tk[j]))tk[j]=c}continue}
  if(/^(my|My)$/.test(w))tk[i]=w==="My"?P.poss[0].toUpperCase()+P.poss.slice(1):P.poss;
  else if(w==="myself")tk[i]=P.refl;else if(w==="me")tk[i]=P.obj;}
 return tk.join("").replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase())}
function povVi(text,pv,tense){const name=POV[pv].vi;let t=text.replace(/(^|[\s,.(])([Tt])ôi(?=[\s,.)])/g,(m,a,T)=>a+(T==="T"?name[0].toUpperCase()+name.slice(1):name));
 if(tense==="past")t=t.replace(new RegExp("("+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\s(?!đã|đang)","gi"),"$1 đã ");return t}
const storyFinal=()=>{const c={sent:0};return buildStory().map(x=>({...x,en:povEn(x.en,narr.pov||"i",narr.tense||"present",c),vi:povVi(x.vi,narr.pov||"i",narr.tense||"present")}))};
const storyText=()=>storyFinal().map(x=>x.en).join(" ");
/* ---------- Ngôn ngữ dịch: Việt + 10 ngôn ngữ ---------- */
const I18N=window.ELW_I18N||{langs:{},actions:{},objects:{}};
const LANGS={vi:{name:"Tiếng Việt",flag:"🇻🇳"},...I18N.langs};
const curLang=()=>LANGS[narr.lang]?narr.lang:"vi";
function trLabel(a){const L=curLang();return L==="vi"?a.labelVi:((I18N.actions[a.id]||{})[L]||{}).label||a.labelVi}
function trSent(a){const L=curLang();return L==="vi"?a.vi:((I18N.actions[a.id]||{})[L]||{}).sentence||a.vi}
function trObj(id,o){const L=curLang();return L==="vi"?o.vi:((I18N.objects[id]||{})[L])||o.vi}
// đoạn văn: tiếng Việt được ghép tự nhiên; ngôn ngữ khác ghép từng câu hành động đã dịch
function trSeg(x){const L=curLang();if(L==="vi")return x.vi;
 return x.uids.map(u=>{const q=queue.find(z=>z.uid===u);return q?trSent(ACT[q.id]):""}).filter(Boolean).join(" ")}
/* ---------- Cách đọc theo cấp độ: tốc độ, ngắt cụm, nối âm ---------- */
const READ_LV={simple:{rate:.75,mode:"chunk",pause:650},A1:{rate:.72,mode:"chunk",pause:700},A2:{rate:.8,mode:"chunk",pause:500},
 B1:{rate:.9,mode:"chunk",pause:280},B2:{rate:1,mode:"flow",pause:0},C1:{rate:1.08,mode:"flow",pause:0},C2:{rate:1.15,mode:"flow",pause:0}};
const SPEEDS={auto:null,slow:.7,medium:.9,natural:1.05};
function readCfg(){const L=READ_LV[narr.storyMode]||READ_LV.A2;
 return{rate:SPEEDS[narr.speed||"auto"]||L.rate,mode:(narr.readMode&&narr.readMode!=="auto")?narr.readMode:L.mode,pause:L.pause||400}}
// Tách câu thành cụm ý (chunks) để ngắt nghỉ: dấu câu, từ nối, giới từ dài
function chunksOf(t){return t.split(/(?<=[,.;:!?])\s+|\s+(?=\b(?:and then|and|then|while|after|before|as|once|without|which|so)\b)/i).map(x=>x.trim()).filter(Boolean)}
const lvl=()=>narr.storyMode==="simple"?"simple":narr.storyMode;
const rdOver=()=>({speed:narr.speed||"auto",mode:narr.readMode||"auto"});
async function readAloud(t){t=t.replace(/‿/g," ");
 if(window.ELW_READING){const tk=token;return ELW_READING.play(t,lvl(),rdOver(),(x,r)=>say(x,r),()=>tk!==token)}
 const c=readCfg();
 if(c.mode==="flow")return say(t,c.rate);
 const tk=token;for(const part of chunksOf(t)){if(tk!==token)return;await say(part,c.rate);await sleep(c.pause)}}
// Đánh dấu nối âm: phụ âm cuối + nguyên âm đầu (pick‿up, turn‿on), và "r" nối (for‿a)
function linkify(t){if(window.ELW_READING)return ELW_READING.linkify(t,lvl());return t.replace(/\b([A-Za-z']*[bcdfgklmnpqrstvxz]|[A-Za-z']*[^aeiou\s]e|[A-Za-z']*r)\s+(?=[aeiouAEIOU]\w)/g,(m,w)=>{
 if(/^(a|the|to|I)$/i.test(w))return m;return w+"‿"})}

/* ---------- Diễn lại toàn bộ chuỗi trong lúc đọc đoạn văn ---------- */
let reenacting=false;
async function reenactStory(){
 const segs=storyFinal();if(!segs.length||pumping||reenacting)return;
 reenacting=true;paused=true;resetScene();const tk=token;renderStory();
 try{for(let k=0;k<segs.length;k++){alive(tk);const sg=segs[k];
   storyCard.querySelectorAll(".s").forEach((el,i)=>el.classList.toggle("hl",i===k));hlUid=sg.uids;renderSeq();
   const talk=readAloud(sg.en);
   const acts=(async()=>{for(const u of sg.uids){const q=queue.find(x=>x.uid===u);if(!q)continue;const a=ACT[q.id];if(a.pre())continue;
     running=true;document.body.classList.add("running");await runSeq(a.seq(),tk);
     if(W.activity!=="watching"&&!W.sitting)await pose("idle")}})();
   await Promise.all([talk,acts]);}
 }catch(e){if(!(e instanceof Abort))console.error(e)}
 finally{reenacting=false;running=false;document.body.classList.remove("running");hlUid=null;renderSeq();
  storyCard.querySelectorAll(".s").forEach(el=>el.classList.remove("hl"))}
}

const storyCard=$id("storyCard");
function renderStory(){
 const st=storyFinal();
 storyCard.innerHTML=`<h2>📝 Đoạn văn của tôi <span class="meta">${st.length?"tự ghép từ các hành động đã làm":""}</span></h2>

const SKEY="elw_sequences_v1";
function loadSeqs(){try{const d=JSON.parse(localStorage.getItem(SKEY));if(d&&d.v===1&&Array.isArray(d.list))return d.list.filter(x=>x&&typeof x.name==="string"&&Array.isArray(x.ids)).map(x=>({...x,ids:x.ids.filter(i=>ACT[i])}))}catch(e){}return[]}
function saveSeqs(list){try{localStorage.setItem(SKEY,JSON.stringify({v:1,list}));return true}catch(e){toastG("Không lưu được (trình duyệt chặn bộ nhớ).");return false}}
let confirmReset=false,renaming=-1;

  <button class="iconbtn" id="qClear">🧹 Xoá chuỗi</button>
  <button class="iconbtn" id="qReset">↺ Đặt lại phòng</button>
 </div>
 ${confirmReset?`<div class="confirm">Đưa nhân vật và mọi đồ vật về vị trí ban đầu? Điểm, lịch ôn và sổ từ <b>không</b> bị ảnh hưởng.
   <div class="ctrls" style="margin:6px 0 0"><button class="iconbtn on" id="cYes">Đặt lại</button><button class="iconbtn" id="cNo">Huỷ</button></div></div>`:""}
 ${queue.length?`<ol class="q">${queue.map((q,i)=>{const a=ACT[q.id];return `<li class="${q.status} ${hlUid&&hlUid.includes(q.uid)?"hl":""}">
   <span class="n">${i+1}</span><span class="t"><b>${a.label}</b>${q.auto?" <i class='meta'>(tự thêm)</i>":""}<small>${trLabel(a)} · ${a.object.en}${q.status==="blocked"?" — "+q.why:""}</small></span>
   <span class="st">${ST_LABEL[q.status]}</span>
   ${q.status==="pending"?`<button data-up="${i}" title="Lên">↑</button><button data-dn="${i}" title="Xuống">↓</button><button data-rm="${i}" title="Xoá">✕</button>`:""}</li>`}).join("")}</ol>`
  :`<p class="empty2">Bấm vào đồ vật rồi chọn hành động để thêm vào chuỗi. Bấm ⏸ Tạm dừng để xếp nhiều hành động trước, rồi ▶ Chạy.</p>`}
 <div class="saveform"><input id="seqName" placeholder="Tên chuỗi, ví dụ: Having Milk While Watching TV" maxlength="60"><button class="iconbtn" id="qSave">💾 Lưu</button></div>
 ${seqs.length?`<div class="saved">${seqs.map((x,i)=>renaming===i?`<div><input id="rnIn" value="${x.name.replace(/"/g,"&quot;")}" class="iconbtn" style="flex:1;min-width:0"><button class="iconbtn" data-rnok="${i}">OK</button></div>`
   :`<div><span>📁 <b>${x.name.replace(/</g,"&lt;")}</b> <span class="meta">${x.ids.length} hành động</span></span><button class="iconbtn" data-load="${i}">Mở</button><button class="iconbtn" data-rn="${i}">✎</button><button class="iconbtn" data-del="${i}">🗑</button></div>`).join("")}</div>`:""}`;
 const $q=x=>seqCard.querySelector(x);
 $q("#qPlay").onclick=()=>{if(paused){paused=false;pump()}else paused=true;renderSeq()};
 $q("#qRewind").onclick=()=>{token++;speechStop();paused=true;queue=queue.filter(q=>!q.auto).map(q=>({...q,status:"pending",why:"",ctx:null}));hlUid=null;renderSeq();renderStory();if(selObj&&!cur)renderObject()};
 $q("#qReplay").onclick=replay;

  if(!ids.length){toastG("Chuỗi đang trống.");return}
  const list=loadSeqs().filter(x=>x.name!==name);list.push({name,ids,at:Date.now()});if(saveSeqs(list)){toastG(`Đã lưu chuỗi “${name}”.`);renderSeq()}};

 seqCard.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const l=loadSeqs();l.splice(+b.dataset.del,1);saveSeqs(l);renderSeq()});
 seqCard.querySelectorAll("[data-rn]").forEach(b=>b.onclick=()=>{renaming=+b.dataset.rn;renderSeq();$q("#rnIn").focus()});
 seqCard.querySelectorAll("[data-rnok]").forEach(b=>b.onclick=()=>{const l=loadSeqs(),v=$q("#rnIn").value.trim();if(v){l[+b.dataset.rnok].name=v;saveSeqs(l)}renaming=-1;renderSeq()});
}
function moveItem(i,d){const j=i+d;if(j<0||j>=queue.length||queue[j].status!=="pending")return;[queue[i],queue[j]]=[queue[j],queue[i]];renderSeq()}

function replay(){if(!queue.length){toastG("Chuỗi đang trống.");return}

 ELW_FLOW.renderChips(c.querySelector("#qChips"),sug,id=>({en:ACT[id].label,vi:trLabel(ACT[id])}),id=>{enqueue(id)});
 ELW_FLOW.renderRoutines(c.querySelector("#qRoutines"),ELW_FLOW.ROUTINES,r=>{if(!pumping&&!queue.some(q=>q.status==="pending"))queue=[];r.ids.filter(i=>ACT[i]).forEach(i=>queue.push(mkItem(i)));paused=false;renderSeq();pump();toastG("Bắt đầu: "+r.titleVi)});
 if(sug[0]){$id("guideText").textContent=`${sug[0].why_vi} → “${ACT[sug[0].id].label}”`;guideAct=()=>enqueue(sug[0].id)}
}
const _renderSeqQ=renderSeq;renderSeq=function(){_renderSeqQ();if(!pumping)renderQuick()};
(function(){const ls=$id("langSel");ls.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v.flag||""} ${v.name}</option>`).join("");ls.value=curLang();
 ls.onchange=e=>{narr.lang=e.target.value;savePrefs();renderStory();renderSeq();if(selObj&&!cur)renderObject();else if(cur)render();renderQuick()}})();
(function(){const st=document.createElement("style");st.textContent=(window.ELW_READING&&ELW_READING.css)||"";document.head.appendChild(st)})();
renderRoom();room.classList.add("dusty");applyState();pose("idle");refresh();renderSeq();renderStory();renderDlg();
/* ===== Sửa câu mạnh hơn: thay bộ sửa của speaking-coach bằng ELW_GRAMMAR, lưu lỗi vào sổ ===== */
if(window.ELW_SPEAKING&&window.ELW_GRAMMAR){const old=t=>({text:t,tips:["Câu của bạn ổn! Thử nói dài hơn với một lý do hoặc chi tiết."]});
 window.ELW_CORRECT=function(text){let r;try{r=ELW_GRAMMAR.check(text)}catch(e){return old(text)}
  try{if(window.ELW_DAY)ELW_DAY.onSpeak(text)}catch(e){}
  const real=r.issues.filter(i=>i.type!=="punctuation");
  if(real.length&&window.ELW_MISTAKES){try{ELW_MISTAKES.add(r,{source:"speaking"});renderMistakes()}catch(e){}}
  const tips=r.issues.map(i=>`${i.from?`“${i.from}” → “${i.to}”: `:""}${i.msg_vi}`);
  if(real.length)tips.unshift(`Câu đúng: “${r.corrected}”`);
  return{text:r.corrected,tips:tips.length?tips:old(text).tips}};ELW_SPEAKING.correction=window.ELW_CORRECT}
if(window.ELW_SPEAKING)try{const st=document.createElement("style");st.textContent=ELW_SPEAKING.css||"";document.head.appendChild(st);ELW_SPEAKING.mount($id("speakingCard"),{speak:(t)=>say(t,.95)})}catch(e){console.error(e);$id("speakingCard").hidden=true}
else $id("speakingCard").hidden=true;

/* ===== Sổ lỗi ===== */
function renderMistakes(){const c=$id("mistakeCard");if(!window.ELW_MISTAKES){c.hidden=true;return}
 try{c.innerHTML="";ELW_MISTAKES.renderBook(c,{speak:t=>say(t,.9)})}catch(e){console.error(e);c.hidden=true}}

/* ===== Thế giới có trí nhớ + một ngày tiếng Anh + nhập vai ===== */
let dayItems=[],pendingScene=null,rpPlayer=null;const rpHistory=[];
function lighting(){if(!window.ELW_DAY)return;try{ELW_DAY.applyLighting(room,ELW_DAY.phase(),{weather:ELW_DAY.state.weather})}catch(e){}}
function decorateNeeds(){if(!window.ELW_NEEDS)return;try{ELW_NEEDS.decorate(world,W);ELW_NEEDS.renderPanel($id("needsCard"),{speak:t=>say(t,.9),enqueue:id=>{if(ACT[id])enqueue(id)},W,level:narr.storyMode})}catch(e){console.error(e)}}
function onWorldAction(it,a){
 if(!it.auto)dayItems.push({uid:it.uid,id:it.id,ctx:it.ctx||{}});
 if(window.ELW_NEEDS){ELW_NEEDS.onAction(a.id);ELW_NEEDS.save&&ELW_NEEDS.save()}
 if(window.ELW_DAY){const r=ELW_DAY.onAction(a.id)||{};if(r.endOfDay)setTimeout(showDiary,600)}
 lighting();decorateNeeds();
 if(window.ELW_ROLEPLAY&&!it.auto&&!(rpPlayer&&rpPlayer.isRunning())&&!pendingScene){
  const sc=ELW_ROLEPLAY.shouldTrigger(a.id,{...W,roleplayRunning:!!(rpPlayer&&rpPlayer.isRunning())},rpHistory);if(sc)pendingScene=sc}
}
function afterQueueIdle(){if(pendingScene){const sc=pendingScene;pendingScene=null;startScene(sc)}}
function startScene(sc){const c=$id("rpCard");if(!c||!window.ELW_ROLEPLAY)return;c.hidden=false;rpHistory.push("scene:"+sc);
 if(!rpPlayer)rpPlayer=ELW_ROLEPLAY.createPlayer({container:c,speak:(t,v)=>window.ELW_VOICES?ELW_VOICES.speak(t,v):say(t),
  enqueue:id=>{if(ACT[id])enqueue(id)},correction:t=>{const r=window.ELW_SPEAKING?ELW_SPEAKING.correction(t):{tips:[]};return r},
  listen:listenOnce,onEnd:(id,stats)=>{try{window.ELW_DAY&&ELW_DAY.onRoleplay(id)}catch(e){};setTimeout(()=>{if(!rpPlayer.isRunning())c.hidden=true},4000)}});
 rpPlayer.start(sc);c.scrollIntoView({block:"nearest",behavior:"smooth"})}
function listenOnce(){return new Promise((res,rej)=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return rej(new Error("unsupported"));
 const r=new SR();r.lang="en-US";r.interimResults=false;r.onresult=e=>{const t=e.results[0][0].transcript;try{window.ELW_DAY&&ELW_DAY.onSpeak(t)}catch(_){};res(t)};r.onerror=e=>rej(e);r.start()})}
function showDiary(){if(!window.ELW_DAY)return;const entry=ELW_DAY.endOfDay(dayItems,items=>{const segs=window.ELW_LEVELS?ELW_LEVELS.build(items,narr.storyMode==="simple"?"A2":narr.storyMode,{rich:narr.rich,fallback:id=>STORY[id]?[STORY[id][0],STORY[id][2]]:null}):[];
  const c={sent:0};return{en:segs.map(x=>povEn(x.en,narr.pov||"i","past",c)).join(" "),vi:segs.map(x=>povVi(x.vi,narr.pov||"i","past")).join(" ")}});
 showModal(`<h2>📔 Nhật ký cuối ngày <button class="iconbtn" data-close>✕</button></h2><div id="diaryBox"></div>`);
 ELW_DAY.renderDiary($id("diaryBox"),{speak:t=>readAloud(t),onSave:()=>{toastG("Đã lưu nhật ký! 📔");dayItems=[]}})}
if(window.ELW_DAY){try{const st=document.createElement("style");st.textContent=ELW_DAY.css||"";document.head.appendChild(st);
 if(ELW_DAY.startDay&&!ELW_DAY.state.ended&&!(ELW_DAY.state.quests||[]).length)ELW_DAY.startDay({});
 ELW_DAY.renderHud($id("dayHud"),{speak:t=>say(t,.9),onStartDay:()=>{dayItems=[];lighting()},onEndDay:showDiary});
 ELW_DAY.subscribe&&ELW_DAY.subscribe(()=>lighting())}catch(e){console.error(e)}}
if(window.ELW_NEEDS){try{const st=document.createElement("style");st.textContent=ELW_NEEDS.css||"";document.head.appendChild(st);ELW_NEEDS.load&&ELW_NEEDS.load();
 ELW_NEEDS.setRealTime&&ELW_NEEDS.setRealTime(true);ELW_NEEDS.catchUp&&ELW_NEEDS.catchUp(Date.now())}catch(e){console.error(e)}}else $id("needsCard").hidden=true;
if(window.ELW_ROLEPLAY){const st=document.createElement("style");st.textContent=ELW_ROLEPLAY.css||"";document.head.appendChild(st)}
renderMistakes();setTimeout(()=>{lighting();decorateNeeds()},300);
loadAssets();
window.ELW={startScene:id=>startScene(id),showDiary:()=>showDiary(),linkify:t=>linkify(t),chunksOf:t=>chunksOf(t),readCfg:()=>readCfg(),reenact:()=>reenactStory(),setPov:(p,t)=>{narr.pov=p;narr.tense=t;renderStory()},storyFinal:()=>storyFinal(),ACTIONS,state:()=>W,queue:()=>queue,story:()=>buildStory(),enqueue,replay,resetScene,assets:assetStatus,idle:()=>!pumping&&!queue.some(q=>q.status==="pending")};
</script>
