<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <defs>
    <linearGradient id="sWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f7fb"/>
      <stop offset="100%" stop-color="#ddebf3"/>
    </linearGradient>
    <linearGradient id="sFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8edf2"/>
      <stop offset="100%" stop-color="#cfd8e3"/>
    </linearGradient>
    <linearGradient id="sCartMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="sOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fa8c55"/>
      <stop offset="100%" stop-color="#e8743b"/>
    </linearGradient>
    <linearGradient id="sBaguette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0bf78"/>
      <stop offset="100%" stop-color="#b8782a"/>
    </linearGradient>
    <filter id="sShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.22" flood-color="#1e293b"/>
    </filter>
  </defs>

  <!-- Supermarket Background -->
  <rect width="360" height="150" fill="url(#sWall)"/>
  <!-- Polished Tile Floor -->
  <rect y="150" width="360" height="90" fill="url(#sFloor)"/>
  <line x1="0" y1="185" x2="360" y2="185" stroke="#b0c0d0" stroke-width="1.2" opacity="0.6"/>
  <line x1="0" y1="215" x2="360" y2="215" stroke="#b0c0d0" stroke-width="1.2" opacity="0.6"/>

  <!-- Background Shelves / Aisles -->
  <g transform="translate(15, 20)" opacity="0.85">
    <!-- Shelf unit left -->
    <rect width="130" height="115" rx="3" fill="#e2eaf2" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Shelf dividers -->
    <rect x="0" y="32" width="130" height="6" fill="#b8c7d6"/>
    <rect x="0" y="68" width="130" height="6" fill="#b8c7d6"/>
    <rect x="0" y="104" width="130" height="6" fill="#b8c7d6"/>
    <!-- Products on shelf top -->
    <rect x="8" y="12" width="14" height="20" rx="2" fill="#ef4444"/>
    <rect x="25" y="10" width="16" height="22" rx="2" fill="#3b82f6"/>
    <rect x="44" y="14" width="12" height="18" rx="2" fill="#eab308"/>
    <rect x="60" y="11" width="18" height="21" rx="2" fill="#10b981"/>
    <rect x="82" y="12" width="16" height="20" rx="2" fill="#ec4899"/>
    <rect x="102" y="10" width="20" height="22" rx="2" fill="#8b5cf6"/>
    <!-- Products on shelf mid -->
    <rect x="10" y="44" width="20" height="24" rx="2" fill="#f97316"/>
    <rect x="34" y="46" width="16" height="22" rx="2" fill="#06b6d4"/>
    <rect x="54" y="42" width="22" height="26" rx="2" fill="#84cc16"/>
    <rect x="80" y="45" width="18" height="23" rx="2" fill="#6366f1"/>
    <rect x="102" y="44" width="18" height="24" rx="2" fill="#14b8a6"/>
  </g>

  <!-- Hanging Special Offer Tag / Aisle Sign (Right) -->
  <g transform="translate(265, 25)">
    <line x1="25" y1="-25" x2="25" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect width="66" height="42" rx="8" fill="#e8743b" stroke="#fff" stroke-width="2" filter="url(#sShadow)"/>
    <text x="33" y="18" fill="#fff" font-size="11" font-weight="900" text-anchor="middle" font-family="system-ui">AISLE 3</text>
    <rect x="8" y="24" width="50" height="12" rx="4" fill="#fcdb77"/>
    <text x="33" y="33" fill="#5a3d1f" font-size="8" font-weight="800" text-anchor="middle" font-family="system-ui">★ FRESH ★</text>
  </g>

  <!-- Cart Ground Shadow -->
  <ellipse cx="185" cy="222" rx="88" ry="14" fill="#64748b" opacity="0.35"/>

  <!-- Shopping Cart (Prominent Foreground) -->
  <g transform="translate(110, 80)" filter="url(#sShadow)">
    <!-- Cart Base Chassis -->
    <path d="M12 95 L115 95 L135 110" stroke="url(#sCartMetal)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M25 95 L40 45" stroke="url(#sCartMetal)" stroke-width="5" stroke-linecap="round"/>
    <path d="M105 95 L95 45" stroke="url(#sCartMetal)" stroke-width="5" stroke-linecap="round"/>

    <!-- Wheels (Front & Rear) -->
    <!-- Rear Wheel Left -->
    <g transform="translate(22, 126)">
      <circle cx="0" cy="0" r="10" fill="#334155"/>
      <circle cx="0" cy="0" r="6" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
      <path d="M0 -10 L0 -31" stroke="url(#sCartMetal)" stroke-width="4"/>
    </g>
    <!-- Rear Wheel Right (Inner offset) -->
    <g transform="translate(48, 122)" opacity="0.85">
      <circle cx="0" cy="0" r="8" fill="#334155"/>
      <circle cx="0" cy="0" r="4.5" fill="#94a3b8"/>
      <path d="M0 -8 L-5 -27" stroke="url(#sCartMetal)" stroke-width="3"/>
    </g>
    <!-- Front Wheel Left -->
    <g transform="translate(122, 126)">
      <circle cx="0" cy="0" r="10" fill="#334155"/>
      <circle cx="0" cy="0" r="6" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
      <path d="M0 -10 L-7 -16" stroke="url(#sCartMetal)" stroke-width="4"/>
    </g>
    <!-- Front Wheel Right (Inner offset) -->
    <g transform="translate(138, 122)" opacity="0.85">
      <circle cx="0" cy="0" r="8" fill="#334155"/>
      <circle cx="0" cy="0" r="4.5" fill="#94a3b8"/>
      <path d="M0 -8 L-10 -12" stroke="url(#sCartMetal)" stroke-width="3"/>
    </g>

    <!-- Groceries Piled in Basket (Rendered before front wire mesh) -->
    <!-- 1. French Baguette poking out -->
    <g transform="translate(18, -15) rotate(-35)">
      <rect x="-8" y="-45" width="16" height="70" rx="8" fill="url(#sBaguette)"/>
      <path d="M-6 -32 Q0 -35 6 -32" stroke="#fff3cf" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-6 -18 Q0 -21 6 -18" stroke="#fff3cf" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-6 -4 Q0 -7 6 -4" stroke="#fff3cf" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-6 10 Q0 7 6 10" stroke="#fff3cf" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 2. Pastel Blue Milk Carton -->
    <g transform="translate(36, 12)">
      <!-- Body -->
      <rect x="0" y="0" width="26" height="38" rx="2" fill="#72b5e8"/>
      <!-- White Band -->
      <rect x="0" y="10" width="26" height="15" fill="#ffffff"/>
      <text x="13" y="21" fill="#3b82f6" font-size="7.5" font-weight="900" text-anchor="middle" font-family="system-ui">MILK</text>
      <!-- Gable Roof Top -->
      <polygon points="0,0 13,-12 26,0" fill="#94c7ee"/>
      <rect x="9" y="-15" width="8" height="4" fill="#cbd5e1"/>
    </g>

    <!-- 3. Fresh Leafy Green Broccoli / Lettuce -->
    <g transform="translate(85, 20)">
      <circle cx="0" cy="0" r="14" fill="#2e7d32"/>
      <circle cx="-6" cy="-4" r="10" fill="#388e3c"/>
      <circle cx="6" cy="-5" r="11" fill="#43a047"/>
      <circle cx="0" cy="-8" r="9" fill="#4caf50"/>
      <!-- Highlights -->
      <circle cx="2" cy="-9" r="4" fill="#81c784"/>
      <rect x="-3" y="10" width="6" height="12" rx="2" fill="#c8e6c9"/>
    </g>

    <!-- 4. Shiny Red Apple with Leaf -->
    <g transform="translate(68, 28)">
      <circle cx="-5" cy="0" r="11" fill="#dc2626"/>
      <circle cx="5" cy="0" r="11" fill="#ef4444"/>
      <!-- Highlight -->
      <ellipse cx="-4" cy="-4" rx="4" ry="2.5" fill="#fca5a5" transform="rotate(-30 -4 -4)"/>
      <!-- Stem & Leaf -->
      <path d="M0 -9 Q2 -15 6 -16" stroke="#5a3d1f" stroke-width="2" fill="none"/>
      <path d="M4 -14 Q10 -17 12 -12 Q8 -11 4 -14 Z" fill="#22c55e"/>
    </g>

    <!-- 5. Bunch of Bananas -->
    <g transform="translate(98, 38)">
      <path d="M-8 0 Q5 12 18 2 Q6 2 -8 0 Z" fill="#facc15"/>
      <path d="M-6 4 Q7 16 20 6 Q8 5 -6 4 Z" fill="#eab308"/>
      <circle cx="-8" cy="1" r="2.5" fill="#713f12"/>
    </g>

    <!-- Wire Basket Mesh (3D Trapezoid) -->
    <!-- Back wire grid -->
    <polygon points="15,15 130,22 118,65 30,65" fill="#e2e8f0" opacity="0.35"/>
    <!-- Wire lines horizontal -->
    <g stroke="url(#sCartMetal)" stroke-width="2" opacity="0.8">
      <line x1="20" y1="28" x2="126" y2="33"/>
      <line x1="25" y1="40" x2="122" y2="44"/>
      <line x1="28" y1="52" x2="120" y2="55"/>
      <!-- Wire lines vertical -->
      <line x1="32" y1="16" x2="36" y2="65"/>
      <line x1="48" y1="17" x2="50" y2="65"/>
      <line x1="64" y1="18" x2="64" y2="65"/>
      <line x1="80" y1="19" x2="78" y2="65"/>
      <line x1="96" y1="20" x2="92" y2="65"/>
      <line x1="112" y1="21" x2="106" y2="65"/>
      <line x1="126" y1="22" x2="116" y2="65"/>
    </g>
    <!-- Basket Rim Frame -->
    <polygon points="15,15 130,22 118,65 30,65" fill="none" stroke="url(#sCartMetal)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Push Handle Bar in Signature Orange -->
    <g transform="translate(0, 5)">
      <!-- Handle arms -->
      <line x1="2" y1="18" x2="18" y2="24" stroke="url(#sCartMetal)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Orange Grip -->
      <rect x="-8" y="10" width="14" height="16" rx="5" fill="url(#sOrange)"/>
      <circle cx="-1" cy="18" r="4.5" fill="#d35c24"/>
    </g>
  </g>
</svg>
