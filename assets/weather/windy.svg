    <path d="M220 345 C420 295 560 350 780 325" stroke-width="2.2" opacity="0.8"/>
    <!-- Stream 3 (Lower ground) -->
    <path d="M-10 490 C220 450 440 520 720 480 C880 460 970 510 1030 500" stroke-width="3.5"/>
    
    <!-- Wind Spirals / Swirls -->
