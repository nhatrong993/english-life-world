<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Life World</title>
<style>
:root{--bg:#f6efe4;--card:#fffdf9;--ink:#2d2a26;--muted:#7a7166;--accent:#e8743b;--ok:#3a9d5d;--line:#e3d6c3;--shadow:0 6px 24px #5a3d1f1a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;max-width:1280px;margin:auto;flex-wrap:wrap}
h1{font-size:20px;margin:0}h1 span{color:var(--accent)}
.hud{display:flex;gap:8px;align-items:center}
.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}
.stat.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.2)}}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px;max-width:1280px;margin:auto;padding:0 16px 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.scene{background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--shadow);position:relative;align-self:start}
.scene-bar{display:flex;justify-content:space-between;align-items:center;margin:4px 8px 6px;font-size:14px;color:var(--muted);gap:8px}
#room{width:100%;height:auto;display:block;border-radius:14px;touch-action:manipulation}
.obj{cursor:pointer}
.hit{fill:transparent}
.obj:hover .vec,.obj:focus .vec,.obj.sel .vec{filter:drop-shadow(0 0 5px #ffb46a) drop-shadow(0 0 2px #e8743b)}
.obj:focus{outline:none}
.obj.pulse .vec{animation:pulse 1s ease-in-out 3}@keyframes pulse{50%{filter:drop-shadow(0 0 12px #ff9a3c)}}
.tag{pointer-events:none;font:700 13px system-ui;fill:#5a3d1f;paint-order:stroke;stroke:#fffdf9;stroke-width:4px;opacity:0;transition:opacity .2s}
.obj:hover .tag,.obj:focus .tag,.obj.sel .tag,.show-tags .tag{opacity:1}
/* character parts */
#char .legB,#char .legF{transform-origin:0 -58px}
#char #upper{transform-origin:0 0;transition:transform .35s}
#char #arm{transform-origin:0 0;transition:transform .35s}
#char.walk .legF{animation:legs .45s ease-in-out infinite alternate}
#char.walk .legB{animation:legs .45s ease-in-out infinite alternate-reverse}
#char.walk #bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes legs{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes bob{to{transform:translateY(-3px)}}
#char.idle #bob{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-1.5px)}}
#char.reach #arm{transform:rotate(-80deg)}
#char.bend #upper{transform:rotate(28deg)}#char.bend #arm{transform:rotate(-20deg)}
#char.drink #arm{transform:rotate(-150deg)}
#char.pour #arm{transform:rotate(-95deg)}#char.pour #hand>*{transform:rotate(-70deg)}
#char.sweep #arm{animation:sweepA .5s ease-in-out infinite alternate}@keyframes sweepA{from{transform:rotate(-5deg)}to{transform:rotate(-38deg)}}
#char.wipe #arm{animation:wipeA .45s ease-in-out infinite alternate}@keyframes wipeA{from{transform:rotate(-60deg)}to{transform:rotate(-95deg)}}
#char.water #arm{transform:rotate(-70deg)}#char.water #hand>*{transform:rotate(35deg);transition:transform .4s}
#char.sit #upper{transform:translateY(30px)}#char.sit .legs{transform:scaleY(.42) translateY(-6px)}
#char.sit .legF{transform:rotate(-60deg)}
#char .legs{transform-origin:0 0;transition:transform .35s}
.door{transform-origin:960px 0;transition:transform .6s ease}
.fridge-open .door{transform:scaleX(.12)}
.pane{transition:transform .7s}.win-open #paneL{transform:scaleX(.22)}.win-open #paneR{transform:scaleX(.22)}
#paneL{transform-origin:438px 0}#paneR{transform-origin:582px 0}
#drops{opacity:0}.watering #drops{opacity:1;animation:drop .6s linear infinite}@keyframes drop{to{transform:translateY(14px)}}
.dust{opacity:0;transition:opacity .6s}.dusty .dust{opacity:.75}
.sparkle{opacity:0}.shine .sparkle{animation:sp 1.2s ease}@keyframes sp{30%{opacity:1}100%{opacity:0}}
#leaves{transform-origin:236px 372px;animation:sway 4s ease-in-out infinite}@keyframes sway{50%{transform:rotate(1.5deg)}}
#steam{animation:steam 3s ease-in-out infinite;opacity:.5}@keyframes steam{50%{transform:translateY(-6px);opacity:.15}}
/* panel */
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:12px 10px}
.ohead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ohead b{font-size:22px}.ohead span{color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:15px;color:var(--ink)}
.act:hover:not(:disabled){border-color:var(--accent);background:#fff6ef}
.act:disabled{opacity:.55;cursor:not-allowed}
.act .dot{width:10px;height:10px;border-radius:50%;flex:none}
.act small{display:block;color:var(--muted);font-size:13px}
.act .why{color:#b05a2a;font-size:12px}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.steps button{flex:1;min-width:58px;border:0;background:#f3ebe0;padding:8px 4px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--ink)}
.steps button.on{background:var(--accent);color:#fff}
.sent{font-size:23px;font-weight:700;margin:6px 0;line-height:1.7}
.sent .w{cursor:pointer;border-radius:4px;display:inline-block}.sent .w:hover{background:#ffe3d1}
.sent .key{color:var(--accent)}
.sent .w.lv-new::after{content:attr(data-vi);display:block;font-size:11px;font-weight:400;color:var(--muted);text-align:center;line-height:1}
.sent .w.lv-learning{text-decoration:underline dotted var(--accent);text-underline-offset:5px}
.vi{color:var(--muted);margin-bottom:10px}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}
.btn.sec{background:#f3ebe0;color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}
.vocab{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:#f8f2e9;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.chip small{color:var(--muted);display:block}
.note{background:#fff7e8;border-left:4px solid #f0b54a;padding:8px 10px;border-radius:6px;font-size:14px;margin:10px 0}
.pat{font-size:14px;color:var(--muted)}.pat b{color:var(--ink)}
.res{margin-top:10px;font-size:15px}.good{color:var(--ok)}.bad{color:#c0392b}
.chunk{display:inline-block;background:#f3ebe0;padding:6px 10px;border-radius:8px;margin:3px}.chunk.on{background:var(--accent);color:#fff}
.opts button{display:block;width:100%;text-align:left;margin:6px 0}
.hint{font-size:13px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0;margin-bottom:6px}
.guide{position:sticky;bottom:12px;max-width:1280px;margin:0 auto 12px;padding:0 16px;z-index:5}
.guide button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:15px;color:var(--ink)}
.guide .face{font-size:34px}.guide b{display:block}.guide span{color:var(--muted)}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:18px;padding:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;gap:8px}
.box h3{font-size:15px;margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 10px 14px;position:relative;background:#fffdf8;cursor:pointer}
.tile::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:4px;border-radius:2px;background:var(--sc,#ccc)}
.tile .en{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
#char.point #arm{transform:rotate(-70deg)}
#char.sit.drink #arm{transform:rotate(-150deg)}
.tvscreen{fill:#2b3440;transition:fill .4s}
.tv-on .tvscreen{fill:#6fb3d9;animation:tvf 1.6s steps(2) infinite}
@keyframes tvf{50%{fill:#8fd19a}}
.tv-on .tvglow{opacity:.35}.tvglow{opacity:0;transition:opacity .4s}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.leftcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.leftcol .scene{align-self:stretch}
.card2{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.card2 h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card2 h2 .meta{font-weight:400}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ctrls .iconbtn{font-size:13px;padding:6px 9px}
.iconbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.q{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.q li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;background:#fff}
.q li .n{width:20px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.q li .t{flex:1;min-width:0}.q li .t small{display:block;color:var(--muted);font-size:12px}
.q li .st{font-size:12px;white-space:nowrap}
.q li.running{border-color:var(--accent);background:#fff6ef}
.q li.done .st{color:var(--ok)}.q li.blocked{background:#fdf0ec}.q li.blocked .st{color:#c0392b}
.q li.cancelled{opacity:.55}.q li.hl{outline:2px solid var(--accent)}
.q li button{border:0;background:none;cursor:pointer;font-size:13px;padding:2px 4px;color:var(--muted)}
.confirm{background:#fff7e8;border:1px solid #f0b54a;border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
.saved{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.saved div{display:flex;gap:6px;align-items:center;font-size:14px}.saved div span{flex:1;min-width:0}
.saveform{display:flex;gap:6px;margin-top:6px}.saveform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.story{font-size:17px;line-height:1.7}
.story .s{cursor:pointer;border-radius:4px}.story .s:hover,.story .s.hl{background:#ffe3d1}
.story .s.blocked{text-decoration:line-through;color:var(--muted)}
.story-vi{color:var(--muted);font-size:14px;margin-top:6px}
.story-simple div{padding:2px 0}
.empty2{color:var(--muted);font-size:14px}
.rtabs{display:flex;gap:4px;flex-wrap:wrap}
.rtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.rtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#room{transition:opacity .25s}
.xtabs{display:flex;gap:4px;margin:10px 0 6px;flex-wrap:wrap}
.xlist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.xlist div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.xlist small{color:var(--muted)}
.dlg-list{display:flex;flex-wrap:wrap;gap:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>English <span>Life</span> World</h1>
<div class="hud"><span class="stat" id="pts" title="Điểm: có khi học và ôn đúng">⭐ 0</span><span class="stat" id="prog"></span>
<button class="iconbtn" id="btnBook">📒 Sổ từ</button></div></header>
<main>
<div class="leftcol"><section class="scene">
 <div class="scene-bar"><span class="rtabs" id="roomTabs" role="tablist" aria-label="Chọn phòng"></span>
  <span><button class="iconbtn" id="btnTags">🏷 Tên đồ vật</button> <button class="iconbtn" id="btnReset" title="Đưa mọi đồ vật về chỗ cũ">↺ Dọn phòng</button></span></div>
 <svg id="room" viewBox="0 0 1000 640" role="application" aria-label="Căn phòng tương tác">
  <defs>
   <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e6cf"/><stop offset="1" stop-color="#efd6b6"/></linearGradient>
   <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2c29c"/><stop offset="1" stop-color="#ecd2b0"/></linearGradient>
   <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6a676"/><stop offset="1" stop-color="#c28a5a"/></linearGradient>
   <linearGradient id="gFridge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#d5e1ea"/></linearGradient>
   <radialGradient id="gLight" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
   <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g id="shell-living">
  <!-- room shell -->
  <rect x="120" y="0" width="880" height="330" fill="url(#gWall)"/>
  <polygon points="0,0 120,0 120,330 0,640" fill="url(#gLeft)"/>
  <polygon points="120,330 1000,330 1000,640 0,640" fill="url(#gFloor)"/>
  <g stroke="#b77c4d" stroke-opacity=".35">
   <line x1="120" y1="330" x2="0" y2="640"/><line x1="300" y1="330" x2="230" y2="640"/><line x1="480" y1="330" x2="460" y2="640"/><line x1="660" y1="330" x2="690" y2="640"/><line x1="840" y1="330" x2="920" y2="640"/>
  </g>
  <rect x="120" y="318" width="880" height="12" fill="#c99668"/>
  <polygon points="120,318 120,330 0,640 0,600" fill="#b9875a"/>
  <rect x="120" y="0" width="880" height="330" fill="url(#gLight)"/>
  <!-- wall decor -->
  <rect x="190" y="90" width="90" height="70" rx="4" fill="#fff" stroke="#a8784e" stroke-width="5"/><path d="M198 150 L225 118 L245 140 L258 126 L272 150Z" fill="#8cc08a"/><circle cx="255" cy="108" r="7" fill="#f5c45a"/>
  <g id="steam"><path d="M732 222 q-6 -10 0 -18 q6 -8 0 -16" stroke="#fff" stroke-width="3" fill="none"/></g>
  <!-- rug -->
  <ellipse cx="510" cy="520" rx="260" ry="70" fill="#e9b7a0" opacity=".8"/><ellipse cx="510" cy="520" rx="230" ry="56" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-dasharray="8 8"/>
  <g class="dust" id="dust"><circle cx="470" cy="590" r="4" fill="#8a6a50"/><circle cx="530" cy="598" r="3" fill="#8a6a50"/><circle cx="560" cy="585" r="2.5" fill="#8a6a50"/><circle cx="430" cy="540" r="3" fill="#8a6a50"/><circle cx="600" cy="545" r="2.5" fill="#8a6a50"/></g>

  </g>
  <g id="shell-other"></g>
  <g id="world">
   <!-- tv -->
   <g class="obj" id="o-tv" data-obj="tv" data-base="362" tabindex="0" aria-label="TV, ti vi">
    <g class="vec">
     <ellipse cx="355" cy="362" rx="70" ry="7" fill="#000" opacity=".15" filter="url(#soft)"/>
     <rect x="292" y="300" width="126" height="60" rx="5" fill="#b98a5e"/><rect x="300" y="312" width="52" height="40" rx="3" fill="#a87a50"/><rect x="358" y="312" width="52" height="40" rx="3" fill="#a87a50"/>
     <rect x="350" y="288" width="10" height="14" fill="#555"/><rect x="330" y="296" width="50" height="6" rx="2" fill="#555"/>
     <ellipse class="tvglow" cx="355" cy="250" rx="90" ry="60" fill="#bfe6ff"/>
     <rect x="298" y="208" width="114" height="82" rx="6" fill="#30343b"/><rect class="tvscreen" x="304" y="214" width="102" height="70" rx="3"/>
    </g>
    <text class="tag" x="355" y="200" text-anchor="middle">TV · ti vi</text>
   </g>
   <!-- window -->
   <g class="obj" id="o-window" data-obj="window" data-base="100" tabindex="0" aria-label="window, cửa sổ">
    <g class="vec">
     <rect x="430" y="60" width="160" height="150" rx="6" fill="#bfe3ff" stroke="#a8784e" stroke-width="8"/>
     <path d="M434 170 Q480 150 520 165 T586 160 L586 206 L434 206Z" fill="#9fd39a"/>
     <circle cx="555" cy="95" r="14" fill="#fff3b0"/>
     <rect id="paneL" class="pane" x="438" y="64" width="72" height="142" fill="#eaf6ff" fill-opacity=".75" stroke="#a8784e" stroke-width="3"/>
     <rect id="paneR" class="pane" x="510" y="64" width="72" height="142" fill="#eaf6ff" fill-opacity=".75" stroke="#a8784e" stroke-width="3"/>
     <rect x="420" y="210" width="180" height="10" rx="3" fill="#c99668"/>
    </g>
    <text class="tag" x="510" y="50" text-anchor="middle">window · cửa sổ</text>
   </g>
   <!-- counter -->
   <g id="counter" data-base="361">
    <rect x="660" y="250" width="180" height="110" fill="#e9e1d4"/><rect x="660" y="240" width="180" height="14" rx="3" fill="#b98a5e"/>
    <rect x="672" y="268" width="74" height="80" rx="4" fill="#f4eee4" stroke="#cbbfae"/><rect x="756" y="268" width="74" height="80" rx="4" fill="#f4eee4" stroke="#cbbfae"/>
    <circle cx="738" cy="308" r="3" fill="#a8784e"/><circle cx="764" cy="308" r="3" fill="#a8784e"/>
   </g>
   <!-- fridge -->
   <g class="obj" id="o-fridge" data-obj="fridge" data-base="362" tabindex="0" aria-label="fridge, tủ lạnh">
    <g class="vec">
     <ellipse cx="905" cy="362" rx="62" ry="8" fill="#000" opacity=".15" filter="url(#soft)"/>
     <rect x="850" y="110" width="110" height="250" rx="12" fill="#cfdde7"/>
     <g id="fridgeInside"><rect x="858" y="118" width="94" height="234" rx="6" fill="#f2fbff"/>
      <rect x="858" y="195" width="94" height="4" fill="#bcd3e0"/><rect x="858" y="265" width="94" height="4" fill="#bcd3e0"/>
      <rect x="866" y="244" width="22" height="20" rx="4" fill="#f6b38f"/><circle cx="935" cy="187" r="7" fill="#e7564d"/><circle cx="922" cy="189" r="6" fill="#f2a33a"/>
      <rect x="912" y="330" width="34" height="14" rx="4" fill="#9fd39a"/></g>
     <g class="door"><rect x="850" y="110" width="110" height="250" rx="12" fill="url(#gFridge)" stroke="#b7c7d3" stroke-width="2"/>
      <line x1="850" y1="190" x2="960" y2="190" stroke="#b7c7d3" stroke-width="2"/>
      <rect x="862" y="140" width="6" height="34" rx="3" fill="#9aaab6"/><rect x="862" y="210" width="6" height="50" rx="3" fill="#9aaab6"/>
      <rect x="900" y="150" width="20" height="16" rx="2" fill="#f5c45a" transform="rotate(-8 910 158)"/></g>
    </g>
    <text class="tag" x="905" y="100" text-anchor="middle">fridge · tủ lạnh</text>
   </g>
   <!-- plant -->
   <g class="obj" id="o-plant" data-obj="plant" data-base="376" tabindex="0" aria-label="plant, cái cây">
    <g class="vec">
     <ellipse cx="236" cy="376" rx="34" ry="7" fill="#000" opacity=".15" filter="url(#soft)"/>
     <g id="leaves"><ellipse cx="236" cy="300" rx="38" ry="44" fill="#5fae5a"/><ellipse cx="216" cy="286" rx="16" ry="32" fill="#4c9a49" transform="rotate(-20 216 286)"/><ellipse cx="258" cy="290" rx="14" ry="30" fill="#6dbb66" transform="rotate(22 258 290)"/></g>
     <path d="M210 330 L262 330 L254 376 L218 376Z" fill="#c56b3c"/><rect x="206" y="326" width="60" height="10" rx="3" fill="#d27a48"/>
     <g id="drops"><circle cx="262" cy="318" r="3" fill="#4aa3df"/><circle cx="268" cy="326" r="3" fill="#4aa3df"/></g>
    </g>
    <text class="tag" x="236" y="245" text-anchor="middle">plant · cái cây</text>
   </g>
   <!-- broom spot (prop rendered via props) -->
   <g class="obj" id="o-broom" data-obj="broom" data-base="430" tabindex="0" aria-label="broom, cây chổi">
    <rect class="hit" x="130" y="290" width="70" height="150"/>
    <g class="vec" id="broomSlot"></g>
    <text class="tag" x="165" y="285" text-anchor="middle">broom · cây chổi</text>

const inBox=(p,B)=>p.x>B.x1&&p.x<B.x2&&p.y>B.y1&&p.y<B.y2;
function crossesBox(a,b,B){for(let t=0;t<=1;t+=.04){if(inBox({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t},B))return true}return false}
function route(a,b){const boxes=(OBST[W.room]||[]).filter(B=>!inBox(a,B)&&!inBox(b,B));const B=boxes.find(B=>crossesBox(a,b,B));if(!B)return[b];
 const lane=Math.max(345,Math.min(630,(a.y+b.y)/2<(B.y1+B.y2)/2?B.y1-14:B.y2+14));return[{x:a.x,y:lane},{x:b.x,y:lane},b]}
class Abort extends Error{}
let token=0;const alive=tk=>{if(tk!==token)throw new Abort()};
async function moveTo(spot,tk){
 const tgt={...spot};if(spot===SPOTS.seat)tgt.x=CHAIR_X[W.chair]-4;
 const pts=route({x:W.x,y:W.y},tgt);
 if(pts.some(p=>Math.hypot(p.x-W.x,p.y-W.y)>8))W.activity=null; // rời chỗ thì thôi xem TV
 charG.classList.remove("idle");charG.classList.add("walk");
 try{for(const p of pts){const sx=W.x,sy=W.y,dist=Math.hypot(p.x-sx,p.y-sy);if(dist<2)continue;
  if(Math.abs(p.x-sx)>4)W.dir=p.x>sx?1:-1;
  const dur=reduceMotion?1:dist/0.45;const t0=performance.now();
  await new Promise(res=>{function f(now){if(tk!==token)return res();const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
   W.x=sx+(p.x-sx)*e;W.y=sy+(p.y-sy)*e;placeChar();k<1?requestAnimationFrame(f):res()}requestAnimationFrame(f)});alive(tk)}}
 finally{charG.classList.remove("walk")}
 W.dir=spot.d||W.dir;placeChar();
}

 if(name==="idle"){charG.classList.add("idle");return}charG.classList.add(name);await sleep(reduceMotion?Math.min(ms,150):ms*0.8)}

/* ---------- chạy các bước của một hành động (có thể huỷ an toàn) ---------- */
async function runSeq(steps,tk){
 for(const s of steps){alive(tk);const [op,a,b]=s;
  if(op==="walk")await moveTo(SPOTS[a],tk);
  else if(op==="pose")await pose(a,b);
  else if(op==="wait")await sleep(reduceMotion?50:a*0.8);
  else if(op==="set"){W[a]=b;applyState()}
  else if(op==="take"){W[a]="hand";W.hand=a;applyState()}
  else if(op==="place"){W[a]=b;W.hand=null;applyState()}
  else if(op==="spawn"){const g=makeTemp(a);handG.appendChild(g);await sleep(120)}
  else if(op==="despawn"){handG.querySelectorAll(".temp").forEach(e=>e.remove())}
  else if(op==="sit"){W.sitting=true;W.dir=-1;applyState();await sleep(400)}
  else if(op==="stand"){W.sitting=false;W.activity=null;if(W.room==="living"){applyState();W.x=CHAIR_X[W.chair]+70;W.y=545}else{if("b_lying" in W)W.b_lying=false;applyState();W.y=Math.min(625,W.y+18)}placeChar();await sleep(250)}
  else if(op==="room"){await switchRoom(a,tk)}
  else if(op==="sip"){W.cupLevel=Math.max(0,W.cupLevel-1);applyState()}
  else if(op==="face"){const t=SPOTS[a];if(t)W.dir=t.x<W.x?-1:1;placeChar()}
  else if(op==="activity"){W.activity=a;applyState()}
  else if(op==="fx"){if(a==="clean"){room.classList.remove("dusty")}else if(a==="shine"){const t=$id("o-table");t.classList.remove("shine");void t.getBBox();t.classList.add("shine")}
   else if(a==="watering"){$id("o-plant").classList.add("watering");await sleep(b||1000);$id("o-plant").classList.remove("watering")}}
 }
}

   4b. BỘ ĐIỀU PHỐI CHUỖI HÀNH ĐỘNG
   Mỗi mục: pending → running → done | blocked | cancelled.
   Điều kiện được kiểm tra đúng lúc tới lượt (theo trạng thái thật của phòng).
   ===================================================================== */
let queue=[],paused=false,pumping=false,uidN=1,hlUid=null;
let running=false; // đang chạy một hành động
const mkItem=id=>({uid:uidN++,id,status:"pending",why:"",ctx:null,auto:false});
function enqueue(id){if(paused&&!queue.some(q=>q.status==="pending"))paused=false;queue.push(mkItem(id));renderSeq();if(!paused)pump()}
async function pump(){
 if(pumping)return;pumping=true;const tk=token;
 try{while(!paused&&tk===token){const it=queue.find(q=>q.status==="pending");if(!it)break;await execItem(it,tk)}}
 catch(e){if(!(e instanceof Abort))console.error(e)}
 finally{pumping=false;running=false;document.body.classList.remove("running");renderSeq();renderStory();if(selObj&&!cur)renderObject();
  if(tk===token&&!queue.some(q=>q.status==="pending")&&narr.mode==="after"&&queue.some(q=>q.status==="done"))speakStory()}
}
async function execItem(it,tk){
 const a=ACT[it.id];
 // cần đứng mà đang ngồi → chèn "Get up" thật vào chuỗi (để đoạn văn đúng sự thật)
 const needTravel=a.room&&a.room!=="*"&&a.room!==W.room;
 if(W.sitting&&(needTravel||(!SIT_OK.has(a.id)&&!a.pre()))){const g=mkItem("get_up");g.auto=true;queue.splice(queue.indexOf(it),0,g);await execItem(g,tk);alive(tk)}
 if(a.room&&a.room!=="*"&&a.room!==W.room){const g=mkItem("go_"+a.room);g.auto=true;queue.splice(queue.indexOf(it),0,g);await execItem(g,tk);alive(tk)}
 const why=a.pre();
 if(why){it.status="blocked";it.why=why;renderSeq();renderStory();toastG(`Không làm được “${a.label}”: ${why}`);if(dlgPlayer&&!it.auto)dlgPlayer.actionDone(it.id,false);return}
 it.status="running";running=true;document.body.classList.add("running");
 it.ctx={watching:W.activity==="watching",sitting:W.sitting,cupLevel:W.cupLevel,milkFromFridge:W.milk==="fridge"};
 renderSeq();if(selObj&&!cur)renderObject();
 narrate(a); // giọng đọc bắt đầu cùng lúc với chuyển động, không chờ
 try{await runSeq(a.seq(),tk);it.status="done";
  if(W.activity!=="watching"&&!W.sitting)await pose("idle");else if(!charG.classList.contains("idle"))pose("idle");
 }catch(e){if(e instanceof Abort){it.status="cancelled"}throw e}
 finally{renderSeq();renderStory();if(dlgPlayer&&!it.auto&&(it.status==="done"||it.status==="blocked"))dlgPlayer.actionDone(it.id,it.status==="done")}
}
function resetScene(){
 token++;speechStop();
 queue.forEach(q=>{if(q.status==="running")q.status="cancelled"});paused=true;running=false;
 const keep={x:W.x,y:W.y,dir:W.dir};W={...W0,...keep};
 handG.querySelectorAll(".temp").forEach(e=>e.remove());room.classList.add("dusty");POSES.forEach(p=>charG.classList.remove(p));
 if(typeof renderRoom==="function")renderRoom();
 applyState();pose("idle");if(selObj&&!cur)renderObject();renderSeq();renderStory();
}
/* =====================================================================
   5. TIẾN ĐỘ + SRS (giữ nguyên dữ liệu & thuật toán bản trước)
   ===================================================================== */
const KEY="elw_progress_v1";
let P={};try{P=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
if(!P.items){P={steps:Object.fromEntries(Object.entries(P).map(([k,v])=>[k,v.steps||{}])),items:{},pts:0}}
P.steps=P.steps||{};P.pts=P.pts||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const HOUR=36e5,SRS_HOURS=[0,4,8,23,47,167,335,719,2879],DONE=9,KNOWN=5;
const LABELS=["Chưa học","Mới học","Mới học","Mới học","Mới học","Đã thuộc","Đã thuộc","Nhớ lâu","Khắc sâu","Thành thạo"];
const stageColor=s=>s<=0?"#ddd":s<KNOWN?"#e8a25a":s<7?"#5e9a6f":s<DONE?"#3f7fa8":"#8a6bb3";
const PTS={step:1,learn:5,ok:3,hint:1};
const ivl=s=>SRS_HOURS[Math.max(1,Math.min(s,8))]*HOUR;
const stage=id=>P.items[id]?P.items[id].s:0;
function addPts(n){P.pts+=n;const e=$id("pts");e.textContent="⭐ "+P.pts;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
function learn(id){if(P.items[id])return;P.items[id]={s:1,due:Date.now()+ivl(1),ok:0,bad:0};addPts(PTS.learn);toastG(`Đã thêm “${ACT[id].sentence}” vào lịch ôn. +${PTS.learn}⭐`)}
function review(id,grade){const it=P.items[id],now=Date.now();
 if(grade==="ok"){it.s=Math.min(DONE,it.s+1);it.due=it.s>=DONE?0:now+ivl(it.s);it.ok++;addPts(PTS.ok)}
 else if(grade==="hint"){it.due=now+ivl(1);it.bad++;addPts(PTS.hint)}
 else{it.s=Math.max(1,it.s-(it.s>=KNOWN?2:1));it.due=now+ivl(it.s);it.bad++}
 save();refresh()}
const dueList=()=>Object.keys(P.items).filter(id=>ACT[id]&&P.items[id].s<DONE&&P.items[id].due<=Date.now()).sort((a,b)=>P.items[a].due-P.items[b].due);
function nextDue(){let b=0;for(const id in P.items){const it=P.items[id];if(ACT[id]&&it.s<DONE&&(!b||it.due<b))b=it.due}return b}
function fmtWait(ms){const h=ms/HOUR;return h<1?Math.max(1,Math.round(ms/6e4))+" phút":h<24?Math.round(h)+" giờ":Math.round(h/24)+" ngày"}
function mark(id,step){P.steps[id]=P.steps[id]||{};if(!P.steps[id][step]){P.steps[id][step]=true;addPts(PTS.step)}
 if(step==="recall")learn(id);save();refresh()}
function refresh(){
 const done=ACTIONS.filter(a=>stage(a.id)>0).length;
 $id("prog").textContent=`✅ ${done}/${ACTIONS.length}`;$id("pts").textContent="⭐ "+P.pts;updateGuide();
}

let guideAct=null,gTimer;
function updateGuide(){const t=$id("guideText"),due=dueList(),fresh=ACTIONS.find(a=>a.room===W.room&&!stage(a.id)&&!a.pre());if(pumping){t.textContent="Đang chạy chuỗi hành động… bạn có thể chọn thêm hành động.";return}
 if(due.length){t.textContent=`Hôm nay có ${due.length} câu cần ôn. Ôn ngay để không quên nhé!`;guideAct=startReview}
 else if(fresh){t.textContent=`Thử hành động mới: “${fresh.label}” (${fresh.labelVi}).`;guideAct=()=>{selectObject(fresh.obj);enqueue(fresh.id)}}
 else{const n=nextDue();t.textContent=n?`Giỏi lắm! Lượt ôn tiếp theo sau ${fmtWait(n-Date.now())}. Bấm ↺ Dọn phòng để làm lại các hành động.`:"Bạn đã thành thạo tất cả! 🎉";guideAct=openBook}}
function toastG(msg){$id("guideText").textContent=msg;clearTimeout(gTimer);gTimer=setTimeout(updateGuide,4000)}

let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));voice=v.find(v=>/en-US/.test(v.lang))||v[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate=1){if(window.ELW_VOICES)return ELW_VOICES.speak(t,narr.voice||"adult_female",{rate});return new Promise(r=>{if(!("speechSynthesis" in window)){toastG("Trình duyệt không hỗ trợ phát âm.");return r()}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;u.onend=r;u.onerror=r;speechSynthesis.speak(u);setTimeout(r,8000)})}
let rec=null,chunks=[],myUrl=null;
function setupRec(btn,pbtn,res){
 if(!navigator.mediaDevices||!window.MediaRecorder){btn.disabled=true;res.textContent="Trình duyệt không hỗ trợ thu âm. Hãy nhại theo to lên.";return}
 btn.onclick=async()=>{if(rec&&rec.state==="recording"){rec.stop();return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());myUrl=URL.createObjectURL(new Blob(chunks));pbtn.disabled=false;btn.textContent="⏺ Thu lại";res.textContent="Đã thu xong. Nghe giọng bạn rồi nghe giọng mẫu."};
   rec.start();btn.textContent="⏹ Dừng";res.textContent="Đang thu… nói: "+cur.sentence;
  }catch(e){res.textContent="Không mở được micro. Kiểm tra quyền truy cập micro."}};
 pbtn.onclick=()=>myUrl&&new Audio(myUrl).play();
}
function norm(s){return s.toLowerCase().replace(/i am/g,"i'm").replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean)}
function listenTo(target,out,cb){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){out.innerHTML="Trình duyệt chưa hỗ trợ nhận diện giọng nói (dùng Chrome/Edge). Hãy tự nói rồi tự đánh giá.";return}
 const r=new SR();r.lang="en-US";r.interimResults=false;out.textContent="🎙 Đang nghe…";
 r.onresult=e=>{const said=e.results[0][0].transcript,a=norm(said),b=norm(target);
  const pct=Math.round(b.filter(w=>a.includes(w)).length/b.length*100),miss=b.filter(w=>!a.includes(w));
  out.innerHTML=`Máy nghe được: “<i>${said}</i>”<br>Khớp: <b class="${pct>=75?"good":"bad"}">${pct}%</b>`+(miss.length?` — thiếu/sai: ${miss.map(w=>`<b>${w}</b>`).join(", ")}`:"")+(pct>=75?"":" — thử lại nhé!");cb&&cb(pct)};
 r.onerror=e=>out.textContent="Không nghe rõ ("+e.error+"). Thử lại hoặc kiểm tra micro.";r.start();
}

 const o=OBJECTS[selObj];const acts=o.acts.map(i=>ACT[i]);

 panel.innerHTML=`<div class="ohead"><b>${o.en}</b><span>${o.ipa} · ${o.vi}</span><button class="iconbtn" data-say="${o.en}">🔊</button><span style="margin-left:auto" class="meta">${learned}/${acts.length} đã học</span></div>

 <div class="acts">${acts.map(a=>{const why=busyQ?null:a.pre();return `<div style="display:flex;gap:6px"><button class="act" style="flex:1" data-act="${a.id}" ${why?"disabled":""}>

function sentHTML(l,hide){const s=stage(l.id),lv=s===0?"lv-new":s<KNOWN?"lv-learning":"";
 return l.sentence.split(" ").map(w=>{const c=w.replace(/[^\w']/g,""),k=l.key.includes(c);
  const v=k&&l.vocab.find(x=>{const base=x[0].split(" ")[0].replace(/e$/,"");return c.toLowerCase().startsWith(base.slice(0,Math.max(3,base.length-1)))});
  return `<span class="w ${k?"key "+lv:""}" data-w="${c}" data-vi="${v?v[2]:""}">${hide?"___":w}</span>`}).join(" ")}
function render(){

function openBook(){

/* Action log (sự kiện thật) → đoạn văn (biên tập). Đoạn văn KHÔNG bao giờ được dùng làm trạng thái. */
const VI_CONN={First:"Đầu tiên,",Then:"Sau đó,",Next:"Tiếp theo,","After that":"Sau đó nữa,",Finally:"Cuối cùng,",While:"Trong lúc xem ti vi,",Every:"Thỉnh thoảng,"};
function vpOf(it,rich){const d=STORY[it.id];if(!d)return[ACT[it.id].label.toLowerCase(),ACT[it.id].labelVi.toLowerCase()];
 let en=rich?d[1]:d[0];
 if(it.id==="pour_milk"&&rich&&!it.ctx.milkFromFridge)en="slowly pour milk into the cup"; // chỉ nói "cold" khi sữa vừa lấy từ tủ lạnh
 return[en,d[2]]}
function buildStory(){
 const done=queue.filter(q=>q.status==="done");if(!done.length)return[];
 if(narr.storyMode!=="simple"&&window.ELW_LEVELS){if(!/^[ABC][12]$/.test(narr.storyMode))narr.storyMode="A2";
  return ELW_LEVELS.build(done.map(q=>({uid:q.uid,id:q.id,ctx:q.ctx||{}})),narr.storyMode,{rich:narr.rich,fallback:id=>STORY[id]?[STORY[id][narr.rich?1:0],STORY[id][2]]:null})}
 if(narr.storyMode==="simple")return done.map(it=>{const [en,vi]=vpOf(it,false);return{uids:[it.uid],en:`I ${en}.`,vi:`Tôi ${vi}.`}});
 // gom thành mệnh đề: hành động trong lúc xem TV đứng riêng; còn lại ghép từng cặp bằng "and"
 const cl=[];
 for(const it of done){const special=it.ctx.watching&&it.id==="drink_from_cup";const last=cl[cl.length-1];
  if(!special&&last&&!last.special&&last.items.length<2&&it.id!=="watch_tv"&&last.items[0].id!=="watch_tv")last.items.push(it);
  else cl.push({special,items:[it]})}
 let sipWhile=0;
 return cl.map((c,k)=>{const n=cl.length;let pre,preVi;
  if(c.special){pre=sipWhile++?"Every now and then, I":"While I'm watching TV, I";preVi=VI_CONN[sipWhile>1?"Every":"While"]}
  else if(n===1){pre="I";preVi=""}
  else if(k===0){pre="First, I";preVi=VI_CONN.First}
  else if(k===n-1){pre="Finally, I";preVi=VI_CONN.Finally}
  else{const w=["Then","Next","After that"][(k-1)%3];pre=w+", I";preVi=VI_CONN[w]}
  const parts=c.items.map(it=>vpOf(it,narr.rich));
  const vi=(preVi?preVi+" tôi ":"Tôi ")+parts.map(p=>p[1]).join(" và ")+".";
  return{uids:c.items.map(i=>i.uid),en:`${pre} ${parts.map(p=>p[0]).join(" and ")}.`,vi}});
}
/* ---------- Ngôi kể (I / He / She / tên) + thì (hiện tại / quá khứ) ----------
   Biến đổi trên câu đã ghép: chủ ngữ "I" → người khác, chia lại động từ chính theo ngôi và thì. */
const POV={i:{en:"I",poss:"my",refl:"myself",obj:"me",vi:"tôi"},he:{en:"he",pron:"he",poss:"his",refl:"himself",obj:"him",vi:"anh ấy"},she:{en:"she",pron:"she",poss:"her",refl:"herself",obj:"her",vi:"cô ấy"},
 tom:{en:"Tom",pron:"he",poss:"his",refl:"himself",obj:"him",vi:"Tom"},anna:{en:"Anna",pron:"she",poss:"her",refl:"herself",obj:"her",vi:"Anna"}};
const IRR={be:"was",go:"went",do:"did",have:"had",make:"made",take:"took",put:"put",get:"got",sit:"sat",set:"set",drink:"drank",eat:"ate",sweep:"swept",hang:"hung",lie:"lay",
 read:"read",spread:"spread",find:"found",bring:"brought",hold:"held",leave:"left",wake:"woke",feed:"fed",sleep:"slept",buy:"bought",keep:"kept",begin:"began",choose:"chose",
 wear:"wore",see:"saw",sink:"sank",swing:"swung",draw:"drew",throw:"threw",rise:"rose",shut:"shut",cut:"cut",run:"ran",lay:"laid",unwind:"unwound",give:"gave",come:"came",
 shake:"shook",stand:"stood",fall:"fell",feel:"felt",think:"thought",say:"said",tell:"told",know:"knew",grow:"grew",light:"lit",spend:"spent",send:"sent",catch:"caught",fry:"fried",dry:"dried",empty:"emptied"};
const DOUBLE=new Set(["stop","plug","unplug","grab","drop","step","sip","slip","mop","nod","rub","wrap","chop","pat","tap","hug","drag","jog","plan","shop","pop","scrub"]);
const VERBS=new Set(["open","close","take","put","pick","pour","drink","wipe","clean","sweep","pull","push","sit","get","water","turn","watch","switch","settle","sink","ease","give",
 "set","fill","tuck","return","grab","lift","run","lay","place","swing","fish","slip","nudge","shut","rise","draw","throw","retrieve","flick","unwind","nurse","stop","make",
 "hang","lie","read","spread","eat","find","bring","hold","leave","wake","go","walk","plug","unplug","cut","fry","dry","empty","shake","feed","sleep","buy","keep","begin","choose",
 "wear","see","do","boil","cook","wash","serve","heat","toast","brew","check","look","brush","fold","fluff","charge","rinse","relax","carry","sip","smile","enjoy","finish",
 "start","sweep","press","stir","scrub","chop","add","use","leave","move","help","switch","plug","toss","pack","tidy","straighten","put","set","sink","settle","ease"]);
const ADV=/^(\w+ly|also|then|still|always|just|now|again|soon)$/i;
function third(v){if(v==="have")return"has";if(v==="do")return"does";if(v==="go")return"goes";if(/(s|sh|ch|x|z|o)$/.test(v))return v+"es";if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+"ies";return v+"s"}
function past(v){if(IRR[v])return IRR[v];if(/e$/.test(v))return v+"d";if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+"ied";if(DOUBLE.has(v))return v+v.slice(-1)+"ed";return v+"ed"}
function conj(v,pv,tense){const low=v.toLowerCase();if(!VERBS.has(low)&&!IRR[low])return null;return tense==="past"?past(low):(pv==="i"?low:third(low))}
function povEn(text,pv,tense,ctx){ctx=ctx||{sent:0};if(pv==="i"&&tense!=="past")return text;const P=POV[pv];
 // dạng rút gọn / trợ động từ đi với I
 text=text.replace(/\bI'm\b/g,tense==="past"?`${P.en} was`:(pv==="i"?"I'm":`${P.en} is`))
  .replace(/\bI've\b/g,tense==="past"?`${P.en} had`:(pv==="i"?"I've":`${P.en} has`))
  .replace(/\bI have\b/g,tense==="past"?`${P.en} had`:(pv==="i"?"I have":`${P.en} has`))
  .replace(/\bI am\b/g,tense==="past"?`${P.en} was`:`${P.en} is`);
 const tk=text.split(/(\s+|[,.;!?])/);let subj=false,chain=false,usedName=ctx.sent%2===1;
 for(let i=0;i<tk.length;i++){const w=tk[i];if(!w||/^\s+$/.test(w))continue;
  if(/^[,.;!?]$/.test(w)){if(w!==","){chain=false;ctx.sent++;usedName=ctx.sent%2===1}subj=false;continue}
  if(w==="I"){tk[i]=(P.pron&&usedName)?P.pron:P.en;usedName=true;subj=true;continue}
  if(subj){if(ADV.test(w))continue;const c=conj(w,pv,tense);if(c){tk[i]=c;chain=true}subj=false;continue}
  if(chain&&w==="and"){let j=i+1;while(j<tk.length&&(!tk[j]||/^\s+$/.test(tk[j])||ADV.test(tk[j])))j++;
   if(j<tk.length){const c=conj(tk[j],pv,tense);if(c&&!/ing$/.test(tk[j]))tk[j]=c}continue}
  if(/^(my|My)$/.test(w))tk[i]=w==="My"?P.poss[0].toUpperCase()+P.poss.slice(1):P.poss;
  else if(w==="myself")tk[i]=P.refl;else if(w==="me")tk[i]=P.obj;}
 return tk.join("").replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase())}
function povVi(text,pv,tense){const name=POV[pv].vi;let t=text.replace(/(^|[\s,.(])([Tt])ôi(?=[\s,.)])/g,(m,a,T)=>a+(T==="T"?name[0].toUpperCase()+name.slice(1):name));
 if(tense==="past")t=t.replace(new RegExp("("+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\s(?!đã|đang)","gi"),"$1 đã ");return t}
const storyFinal=()=>{const c={sent:0};return buildStory().map(x=>({...x,en:povEn(x.en,narr.pov||"i",narr.tense||"present",c),vi:povVi(x.vi,narr.pov||"i",narr.tense||"present")}))};
const storyText=()=>storyFinal().map(x=>x.en).join(" ");
function speakStory(){const t=storyText();if(t)say(t,.92)}

 const segs=storyFinal();if(!segs.length||pumping||reenacting)return;
 reenacting=true;paused=true;resetScene();const tk=token;renderStory();
 try{for(let k=0;k<segs.length;k++){alive(tk);const sg=segs[k];
   storyCard.querySelectorAll(".s").forEach((el,i)=>el.classList.toggle("hl",i===k));hlUid=sg.uids;renderSeq();
   const talk=say(sg.en,.92);
   const acts=(async()=>{for(const u of sg.uids){const q=queue.find(x=>x.uid===u);if(!q)continue;const a=ACT[q.id];if(a.pre())continue;
     running=true;document.body.classList.add("running");await runSeq(a.seq(),tk);
     if(W.activity!=="watching"&&!W.sitting)await pose("idle")}})();
   await Promise.all([talk,acts]);}
 }catch(e){if(!(e instanceof Abort))console.error(e)}
 finally{reenacting=false;running=false;document.body.classList.remove("running");hlUid=null;renderSeq();

}

 ${confirmReset?`<div class="confirm">Đưa nhân vật và mọi đồ vật về vị trí ban đầu? Điểm, lịch ôn và sổ từ <b>không</b> bị ảnh hưởng.
   <div class="ctrls" style="margin:6px 0 0"><button class="iconbtn on" id="cYes">Đặt lại</button><button class="iconbtn" id="cNo">Huỷ</button></div></div>`:""}
 ${queue.length?`<ol class="q">${queue.map((q,i)=>{const a=ACT[q.id];return `<li class="${q.status} ${hlUid&&hlUid.includes(q.uid)?"hl":""}">
   <span class="n">${i+1}</span><span class="t"><b>${a.label}</b>${q.auto?" <i class='meta'>(tự thêm)</i>":""}<small>${a.labelVi} · ${a.object.en}${q.status==="blocked"?" — "+q.why:""}</small></span>
   <span class="st">${ST_LABEL[q.status]}</span>
   ${q.status==="pending"?`<button data-up="${i}" title="Lên">↑</button><button data-dn="${i}" title="Xuống">↓</button><button data-rm="${i}" title="Xoá">✕</button>`:""}</li>`}).join("")}</ol>`
  :`<p class="empty2">Bấm vào đồ vật rồi chọn hành động để thêm vào chuỗi. Bấm ⏸ Tạm dừng để xếp nhiều hành động trước, rồi ▶ Chạy.</p>`}
 <div class="saveform"><input id="seqName" placeholder="Tên chuỗi, ví dụ: Having Milk While Watching TV" maxlength="60"><button class="iconbtn" id="qSave">💾 Lưu</button></div>
 ${seqs.length?`<div class="saved">${seqs.map((x,i)=>renaming===i?`<div><input id="rnIn" value="${x.name.replace(/"/g,"&quot;")}" class="iconbtn" style="flex:1;min-width:0"><button class="iconbtn" data-rnok="${i}">OK</button></div>`
   :`<div><span>📁 <b>${x.name.replace(/</g,"&lt;")}</b> <span class="meta">${x.ids.length} hành động</span></span><button class="iconbtn" data-load="${i}">Mở</button><button class="iconbtn" data-rn="${i}">✎</button><button class="iconbtn" data-del="${i}">🗑</button></div>`).join("")}</div>`:""}`;
 const $q=x=>seqCard.querySelector(x);
 $q("#qPlay").onclick=()=>{if(paused){paused=false;pump()}else paused=true;renderSeq()};
 $q("#qRewind").onclick=()=>{token++;speechStop();paused=true;queue=queue.filter(q=>!q.auto).map(q=>({...q,status:"pending",why:"",ctx:null}));hlUid=null;renderSeq();renderStory();if(selObj&&!cur)renderObject()};
 $q("#qReplay").onclick=replay;
 $q("#qClear").onclick=()=>{token++;speechStop();queue=[];paused=false;hlUid=null;renderSeq();renderStory();if(selObj&&!cur)renderObject()};
 $q("#qReset").onclick=askReset;
 if(confirmReset){$q("#cYes").onclick=()=>{confirmReset=false;resetScene();toastG("Đã đặt lại phòng. Tiến độ học vẫn giữ nguyên.")};$q("#cNo").onclick=()=>{confirmReset=false;renderSeq()}}
 seqCard.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveItem(+b.dataset.up,-1));
 seqCard.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>moveItem(+b.dataset.dn,1));
 seqCard.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{queue.splice(+b.dataset.rm,1);renderSeq()});
 $q("#qSave").onclick=()=>{const name=$q("#seqName").value.trim(),ids=queue.filter(q=>!q.auto&&q.status!=="blocked").map(q=>q.id);
  if(!name){toastG("Hãy đặt tên cho chuỗi trước khi lưu.");$q("#seqName").focus();return}
  if(!ids.length){toastG("Chuỗi đang trống.");return}
  const list=loadSeqs().filter(x=>x.name!==name);list.push({name,ids,at:Date.now()});if(saveSeqs(list)){toastG(`Đã lưu chuỗi “${name}”.`);renderSeq()}};
 seqCard.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{const x=loadSeqs()[+b.dataset.load];token++;speechStop();paused=true;queue=x.ids.map(mkItem);hlUid=null;renderSeq();renderStory();toastG(`Đã mở “${x.name}”. Bấm 🔁 Phát lại để chạy từ đầu.`)});
 seqCard.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const l=loadSeqs();l.splice(+b.dataset.del,1);saveSeqs(l);renderSeq()});
 seqCard.querySelectorAll("[data-rn]").forEach(b=>b.onclick=()=>{renaming=+b.dataset.rn;renderSeq();$q("#rnIn").focus()});
 seqCard.querySelectorAll("[data-rnok]").forEach(b=>b.onclick=()=>{const l=loadSeqs(),v=$q("#rnIn").value.trim();if(v){l[+b.dataset.rnok].name=v;saveSeqs(l)}renaming=-1;renderSeq()});
}
function moveItem(i,d){const j=i+d;if(j<0||j>=queue.length||queue[j].status!=="pending")return;[queue[i],queue[j]]=[queue[j],queue[i]];renderSeq()}
function askReset(){confirmReset=true;renderSeq();seqCard.scrollIntoView({block:"nearest",behavior:"smooth"})}
function replay(){if(!queue.length){toastG("Chuỗi đang trống.");return}
 const ids=queue.filter(q=>!q.auto).map(q=>q.id);resetScene();queue=ids.map(mkItem);paused=false;hlUid=null;renderSeq();renderStory();pump()}

/* =====================================================================
   11. HỌC THÊM: chunks, từ mới, ngữ pháp theo trình độ
   ===================================================================== */
let xTab="chunks";
function renderExtras(st){const box=$id("extras");if(!box)return;
 if(!st.length||!window.ELW_LEVELS||narr.storyMode==="simple"){box.innerHTML="";return}
 let x;try{x=ELW_LEVELS.extras(queue.filter(q=>q.status==="done").map(q=>({uid:q.uid,id:q.id,ctx:q.ctx||{}})),narr.storyMode,{rich:narr.rich,fallback:id=>STORY[id]?[STORY[id][0],STORY[id][2]]:null})}catch(e){box.innerHTML="";return}
 const T={chunks:"🧩 Chunks",words:"📚 Từ mới",grammar:"📐 Ngữ pháp"};
 const body=xTab==="chunks"?x.chunks.map(c=>`<div><button class="iconbtn" data-x="${c.en}">🔊</button><b>${c.en}</b><small>${c.vi}</small></div>`).join("")
  :xTab==="words"?x.words.map(w=>`<div><button class="iconbtn" data-x="${w.en}">🔊</button><b>${w.en}</b><small>${w.ipa||""} · ${w.vi}</small></div>`).join("")
  :x.grammar.map(g=>`<div style="display:block"><b>${g.title}</b><br><small>${g.vi_explain}</small><br><i>${g.example}</i></div>`).join("");
 box.innerHTML=`<div class="xtabs">${Object.entries(T).map(([k,t])=>`<button class="iconbtn ${xTab===k?"on":""}" data-xt="${k}">${t}</button>`).join("")}</div><div class="xlist">${body||'<span class="empty2">Chưa có mục nào.</span>'}</div>`;
 box.querySelectorAll("[data-xt]").forEach(b=>b.onclick=()=>{xTab=b.dataset.xt;renderExtras(st)});
 box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>say(b.dataset.x,.85));
}

/* =====================================================================
   12. NHIỀU PHÒNG: phòng khách, bếp, phòng ngủ
   ===================================================================== */
const shellLiving=$id("shell-living"),shellOther=$id("shell-other");
[...world.children].forEach(e=>{if(e.id!=="char")e.dataset.room="living"});
(function injectCss(){let c=Object.values(ROOMS).map(r=>r.css||"").join("\n");if(window.ELW_DIALOGUE)c+="\n"+ELW_DIALOGUE.css;const st=document.createElement("style");st.textContent=c;document.head.appendChild(st)})();
function renderTabs(){const t=$id("roomTabs");if(!t)return;
 t.innerHTML=Object.entries(ROOM_NAMES).map(([id,[en,vi]])=>`<button role="tab" aria-selected="${W.room===id}" class="${W.room===id?"on":""}" data-room="${id}" title="${en}">${{living:"🛋",kitchen:"🍳",bedroom:"🛏"}[id]||"🚪"} ${vi}</button>`).join("");
 t.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{if(b.dataset.room!==W.room)enqueue("go_"+b.dataset.room)})}
let shownRoom=null;
function renderRoom(){if(shownRoom===W.room)return;shownRoom=W.room;
 const liv=W.room==="living";shellLiving.style.display=liv?"":"none";
 [...world.children].forEach(e=>{if(e.dataset.room==="living")e.style.display=liv?"":"none"});
 world.querySelectorAll(":scope > [data-room]:not([data-room=living])").forEach(e=>e.remove());
 shellOther.innerHTML="";
 if(!liv){const r=ROOMS[W.room];shellOther.innerHTML=r.shellSvg;const g=document.createElementNS(SVGNS,"g");g.innerHTML=r.worldSvg;
  [...g.children].forEach(e=>{e.dataset.room=r.id;world.appendChild(e);if(e.classList.contains("obj"))bindObj(e)});
  ["k_","b_"].forEach(()=>{});}
 if(selObj&&OBJECTS[selObj]&&OBJECTS[selObj].room!==W.room&&!cur){selObj=null;panel.innerHTML=`<div class="empty">👈 ${ROOM_NAMES[W.room][1]}: nhấn vào một đồ vật.</div>`}
 if(inv)inv.refresh&&inv.refresh();
}
async function switchRoom(id,tk){room.style.opacity=0;await sleep(reduceMotion?10:260);alive(tk);
 W.room=id;W.activity=null;renderRoom();const e=id==="living"?{x:120,y:600,d:1}:ROOMS[id].entry;W.x=e.x;W.y=e.y;W.dir=e.d;applyState();
 room.style.opacity=1;await sleep(reduceMotion?10:260)}
const _applyState=applyState;

/* =====================================================================
   13. HỘI THOẠI GIA ĐÌNH (nhân vật Mẹ)
   ===================================================================== */
let dlgPlayer=null,mom=null;
function renderDlg(){const c=$id("dlgCard");if(!window.ELW_DIALOGUE){c.hidden=true;return}
 c.innerHTML=`<h2>💬 Hội thoại với Mẹ <span class="meta">nghe, chọn câu trả lời, nhân vật làm theo</span></h2>
 <div class="dlg-list">${ELW_DIALOGUE.SCRIPTS.map(s=>`<button class="iconbtn" data-dlg="${s.id}" title="${s.titleVi}">${s.level} · ${s.title}</button>`).join("")}</div><div id="dlgBox" style="margin-top:8px"></div>`;
 c.querySelectorAll("[data-dlg]").forEach(b=>b.onclick=()=>startDialogue(b.dataset.dlg));
}
function startDialogue(id){
 if(!mom){mom=ELW_DIALOGUE.makeMom(SVGNS);mom.dataset.room="living";mom.dataset.base=600;mom.setAttribute("transform","translate(150,600) scale(1.6)");world.appendChild(mom);sortDepth()}
 mom.style.display=W.room==="living"?"":"none";
 if(dlgPlayer)dlgPlayer.stop();
 dlgPlayer=ELW_DIALOGUE.createPlayer({container:$id("dlgBox"),speak:(t,v)=>window.ELW_VOICES?ELW_VOICES.speak(t,v):say(t),enqueue:aid=>enqueue(aid),meVoice:narr.voice||"young_male",
  onLine:l=>{if(mom){mom.classList.toggle("talk",l.who==="mom");setTimeout(()=>mom.classList.remove("talk"),1800)}},onDone:()=>toastG("Hoàn thành hội thoại! 🎉")});
 dlgPlayer.start(id);
}

/* =====================================================================
   14. KHO ĐỒ: 150+ từ vựng theo phòng, tìm kiếm, đố nhanh
   ===================================================================== */
let inv=null;P.inv=P.inv||{};
function catalogAll(){const out=[];const add=(list,room)=>(list||[]).forEach(c=>out.push({...c,room}));
 add(window.ELW_ROOMS_CATALOG_LIVING,"living");for(const r of Object.values(ROOMS))add(r.catalog,r.id);return out}
const CAT=catalogAll();
function objForCatalog(c){const en=c.en.toLowerCase();return Object.keys(OBJECTS).find(k=>OBJECTS[k].room===c.room&&(OBJECTS[k].en.toLowerCase()===en||k===en||(en==="refrigerator"&&k==="fridge")||(en==="television"&&k==="tv")))}
if(window.ELW_INVENTORY){inv=ELW_INVENTORY.mount($id("invWrap"),{getCatalog:()=>CAT,
 rooms:Object.entries(ROOM_NAMES).map(([id,[name,nameVi]])=>({id,name,nameVi})),currentRoom:()=>W.room,
 interactiveIds:()=>new Set(CAT.filter(c=>c.room===W.room&&objForCatalog(c)).map(c=>c.id)),
 onSelectInteractive:id=>{const c=CAT.find(x=>x.id===id),k=c&&objForCatalog(c);if(k){selectObject(k);pulse(k);$id("room").scrollIntoView({block:"nearest",behavior:"smooth"})}},
 speak:t=>say(t,.85),isLearned:id=>!!P.inv[id],toggleLearned:id=>{P.inv[id]=!P.inv[id];save()}});}

$id("leftSlot").replaceWith($id("panel"),$id("storyCard"));renderRoom();room.classList.add("dusty");applyState();pose("idle");refresh();renderSeq();renderStory();renderDlg();loadAssets();
window.ELW={reenact:()=>reenactStory(),setPov:(p,t)=>{narr.pov=p;narr.tense=t;renderStory()},storyFinal:()=>storyFinal(),ACTIONS,state:()=>W,queue:()=>queue,story:()=>buildStory(),enqueue,replay,resetScene,assets:assetStatus,idle:()=>!pumping&&!queue.some(q=>q.status==="pending")};
</script>
</body>
</html>
