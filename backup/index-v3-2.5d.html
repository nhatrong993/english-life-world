<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Life World</title>
<style>
:root{--bg:#f6efe4;--card:#fffdf9;--ink:#2d2a26;--muted:#7a7166;--accent:#e8743b;--ok:#3a9d5d;--line:#e3d6c3;--shadow:0 6px 24px #5a3d1f1a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;max-width:1280px;margin:auto;flex-wrap:wrap}
h1{font-size:20px;margin:0}h1 span{color:var(--accent)}
.hud{display:flex;gap:8px;align-items:center}
.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}
.stat.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.2)}}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px;max-width:1280px;margin:auto;padding:0 16px 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.scene{background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--shadow);position:relative;align-self:start}
.scene-bar{display:flex;justify-content:space-between;align-items:center;margin:4px 8px 6px;font-size:14px;color:var(--muted);gap:8px}
#room{width:100%;height:auto;display:block;border-radius:14px;touch-action:manipulation}
.obj{cursor:pointer}
.obj .hit{fill:transparent}
.obj:hover .vec,.obj:focus .vec,.obj.sel .vec{filter:drop-shadow(0 0 5px #ffb46a) drop-shadow(0 0 2px #e8743b)}
.obj:focus{outline:none}
.obj.pulse .vec{animation:pulse 1s ease-in-out 3}@keyframes pulse{50%{filter:drop-shadow(0 0 12px #ff9a3c)}}
.tag{pointer-events:none;font:700 13px system-ui;fill:#5a3d1f;paint-order:stroke;stroke:#fffdf9;stroke-width:4px;opacity:0;transition:opacity .2s}
.obj:hover .tag,.obj:focus .tag,.obj.sel .tag,.show-tags .tag{opacity:1}
/* character parts */
#char .legB,#char .legF{transform-origin:0 -58px}
#char #upper{transform-origin:0 0;transition:transform .35s}
#char #arm{transform-origin:0 0;transition:transform .35s}
#char.walk .legF{animation:legs .45s ease-in-out infinite alternate}
#char.walk .legB{animation:legs .45s ease-in-out infinite alternate-reverse}
#char.walk #bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes legs{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes bob{to{transform:translateY(-3px)}}
#char.idle #bob{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-1.5px)}}
#char.reach #arm{transform:rotate(-80deg)}
#char.bend #upper{transform:rotate(28deg)}#char.bend #arm{transform:rotate(-20deg)}
#char.drink #arm{transform:rotate(-150deg)}
#char.pour #arm{transform:rotate(-95deg)}#char.pour #hand>*{transform:rotate(-70deg)}
#char.sweep #arm{animation:sweepA .5s ease-in-out infinite alternate}@keyframes sweepA{from{transform:rotate(-5deg)}to{transform:rotate(-38deg)}}
#char.wipe #arm{animation:wipeA .45s ease-in-out infinite alternate}@keyframes wipeA{from{transform:rotate(-60deg)}to{transform:rotate(-95deg)}}
#char.water #arm{transform:rotate(-70deg)}#char.water #hand>*{transform:rotate(35deg);transition:transform .4s}
#char.sit #upper{transform:translateY(30px)}#char.sit .legs{transform:scaleY(.42) translateY(-6px)}
#char.sit .legF{transform:rotate(-60deg)}
#char .legs{transform-origin:0 0;transition:transform .35s}
.door{transform-origin:960px 0;transition:transform .6s ease}
.fridge-open .door{transform:scaleX(.12)}
.pane{transition:transform .7s}.win-open #paneL{transform:scaleX(.22)}.win-open #paneR{transform:scaleX(.22)}
#paneL{transform-origin:438px 0}#paneR{transform-origin:582px 0}
#drops{opacity:0}.watering #drops{opacity:1;animation:drop .6s linear infinite}@keyframes drop{to{transform:translateY(14px)}}
.dust{opacity:0;transition:opacity .6s}.dusty .dust{opacity:.75}
.sparkle{opacity:0}.shine .sparkle{animation:sp 1.2s ease}@keyframes sp{30%{opacity:1}100%{opacity:0}}
#leaves{transform-origin:236px 372px;animation:sway 4s ease-in-out infinite}@keyframes sway{50%{transform:rotate(1.5deg)}}
#steam{animation:steam 3s ease-in-out infinite;opacity:.5}@keyframes steam{50%{transform:translateY(-6px);opacity:.15}}
/* panel */
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-height:300px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.ohead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ohead b{font-size:22px}.ohead span{color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:15px;color:var(--ink)}
.act:hover:not(:disabled){border-color:var(--accent);background:#fff6ef}
.act:disabled{opacity:.55;cursor:not-allowed}
.act .dot{width:10px;height:10px;border-radius:50%;flex:none}
.act small{display:block;color:var(--muted);font-size:13px}
.act .why{color:#b05a2a;font-size:12px}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.steps button{flex:1;min-width:58px;border:0;background:#f3ebe0;padding:8px 4px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--ink)}
.steps button.on{background:var(--accent);color:#fff}
.sent{font-size:23px;font-weight:700;margin:6px 0;line-height:1.7}
.sent .w{cursor:pointer;border-radius:4px;display:inline-block}.sent .w:hover{background:#ffe3d1}
.sent .key{color:var(--accent)}
.sent .w.lv-new::after{content:attr(data-vi);display:block;font-size:11px;font-weight:400;color:var(--muted);text-align:center;line-height:1}
.sent .w.lv-learning{text-decoration:underline dotted var(--accent);text-underline-offset:5px}
.vi{color:var(--muted);margin-bottom:10px}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0}
.btn.sec{background:#f3ebe0;color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}
.vocab{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:#f8f2e9;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px}
.chip small{color:var(--muted);display:block}
.note{background:#fff7e8;border-left:4px solid #f0b54a;padding:8px 10px;border-radius:6px;font-size:14px;margin:10px 0}
.pat{font-size:14px;color:var(--muted)}.pat b{color:var(--ink)}
.res{margin-top:10px;font-size:15px}.good{color:var(--ok)}.bad{color:#c0392b}
.chunk{display:inline-block;background:#f3ebe0;padding:6px 10px;border-radius:8px;margin:3px}.chunk.on{background:var(--accent);color:#fff}
.opts button{display:block;width:100%;text-align:left;margin:6px 0}
.hint{font-size:13px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0;margin-bottom:6px}
.guide{position:sticky;bottom:12px;max-width:1280px;margin:0 auto 12px;padding:0 16px;z-index:5}
.guide button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line);font-size:15px;color:var(--ink)}
.guide .face{font-size:34px}.guide b{display:block}.guide span{color:var(--muted)}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:18px;padding:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;gap:8px}
.box h3{font-size:15px;margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 10px 14px;position:relative;background:#fffdf8;cursor:pointer}
.tile::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:4px;border-radius:2px;background:var(--sc,#ccc)}
.tile .en{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      <path d="M2 -66 Q8 -62 13 -66" stroke="#9a4a3a" stroke-width="2" fill="none" stroke-linecap="round"/>

      <g transform="translate(4,-44)"><g id="arm">

// điểm đứng tương tác (chân nhân vật) + hướng nhìn
const SPOTS={fridge:{x:800,y:400,d:1},counter:{x:705,y:398,d:1},tableL:{x:335,y:478,d:1},chairSide:{x:790,y:540,d:-1},seat:{x:0,y:530,d:-1},
 window:{x:510,y:360,d:1},plant:{x:300,y:392,d:-1},bookFloor:{x:345,y:592,d:1},broom:{x:222,y:440,d:-1},floorMid:{x:440,y:598,d:1},underTable:{x:330,y:520,d:1}};
const itemSpot={counter:"counter",table:"tableL",fridge:"fridge",floor:"bookFloor",wall:"broom"};
const CHAIR_X={in:690,out:760};
function fetchSteps(item){ // các bước để lấy đồ vào tay (dùng cho hành động kết hợp)
 if(W[item]==="hand")return[];
 const loc=W[item];const s=[["walk",itemSpot[loc]]];
 if(loc==="fridge")s.push(["pose","reach",350],["set","fridge","open"],["wait",300]);
 s.push(["pose",loc==="floor"?"bend":"reach",500],["take",item]);
 if(loc==="fridge")s.push(["pose","reach",300],["set","fridge","closed"]);

/* ---------- vẽ trạng thái ---------- */
const room=$id("room"),charG=$id("char"),world=$id("world"),handG=$id("hand");
function charScale(y){return 0.95+(y-330)/310*0.5}
function placeChar(){const s=charScale(W.y)*1.25;charG.setAttribute("transform",`translate(${W.x},${W.y}) scale(${s.toFixed(3)})`);
 $id("flip").setAttribute("transform",`scale(${W.dir},1)`);charG.dataset.base=W.y+(W.sitting?3:0);sortDepth()}
function sortDepth(){const kids=[...world.children].filter(e=>e.dataset&&e.dataset.base);kids.sort((a,b)=>+a.dataset.base-+b.dataset.base);kids.forEach(k=>world.appendChild(k))}
function applyState(){
 $id("o-fridge").classList.toggle("fridge-open",W.fridge==="open");
 $id("o-window").classList.toggle("win-open",W.window==="open");
 const cx=CHAIR_X[W.chair];$id("chairG").setAttribute("transform",`translate(${cx},0)`);$id("chairTag").setAttribute("x",cx);
 $id("o-chair").dataset.base=528;
 for(const name of ["cup","milk","book","broom"]){
  const p=props[name],loc=W[name];
  if(loc==="hand"){handG.appendChild(p);p.setAttribute("transform",name==="broom"?"translate(0,70)":"translate(0,14)");p.style.display="";continue}
  const L=LOCS[name][loc]||Object.values(LOCS[name])[0];

  const host=name==="milk"?slot:slot.closest(".obj");host.dataset.base=L.b;
  p.style.display=(name==="milk"&&loc==="fridge"&&W.fridge!=="open")?"none":"";
 }
 $id("cupTag").setAttribute("x",LOCS.cup[W.cup]?LOCS.cup[W.cup].x:W.x);$id("cupTag").setAttribute("y",LOCS.cup[W.cup]?LOCS.cup[W.cup].y-36:W.y-200);
 $id("bookTag").setAttribute("x",LOCS.book[W.book]?LOCS.book[W.book].x:W.x);$id("bookTag").setAttribute("y",LOCS.book[W.book]?LOCS.book[W.book].y-22:W.y-200);
 const fl=props.cup.querySelector(".fill");if(fl)fl.setAttribute("opacity",W.cupFull?1:0);
 charG.classList.toggle("sit",W.sitting);
 placeChar();saveW();

/* ---------- di chuyển nhân vật ---------- */
const TABLE_BOX={x1:350,x2:670,y1:420,y2:528};
function crossesTable(a,b){for(let t=0;t<=1;t+=.05){const x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;if(x>TABLE_BOX.x1&&x<TABLE_BOX.x2&&y>TABLE_BOX.y1&&y<TABLE_BOX.y2)return true}return false}
function route(a,b){if(!crossesTable(a,b))return[b];const lane=(a.y+b.y)/2<480?400:575;return[{x:a.x,y:lane},{x:b.x,y:lane},b]}
async function moveTo(spot){
 const tgt={...spot};if(spot===SPOTS.seat)tgt.x=CHAIR_X[W.chair]-4;
 const pts=route({x:W.x,y:W.y},tgt);
 charG.classList.remove("idle");charG.classList.add("walk");
 for(const p of pts){const sx=W.x,sy=W.y,dist=Math.hypot(p.x-sx,p.y-sy);if(dist<2)continue;
  if(Math.abs(p.x-sx)>4)W.dir=p.x>sx?1:-1;
  const dur=reduceMotion?1:dist/0.32;const t0=performance.now();
  await new Promise(res=>{function f(now){const k=Math.min(1,(now-t0)/dur);W.x=sx+(p.x-sx)*k;W.y=sy+(p.y-sy)*k;placeChar();k<1?requestAnimationFrame(f):res()}requestAnimationFrame(f)})}
 charG.classList.remove("walk");W.dir=spot.d||W.dir;placeChar();
}
const POSES=["reach","bend","drink","pour","sweep","wipe","water"];
async function pose(name,ms){POSES.forEach(p=>charG.classList.remove(p));charG.classList.remove("idle");
 if(name==="idle"){charG.classList.add("idle");return}charG.classList.add(name);await sleep(reduceMotion?Math.min(ms,200):ms)}

/* ---------- bộ máy chạy chuỗi hành động (state machine đơn giản) ---------- */
let running=false;
async function runSeq(steps){
 for(const s of steps){const [op,a,b]=s;
  if(op==="walk")await moveTo(SPOTS[a]);
  else if(op==="pose")await pose(a,b);
  else if(op==="wait")await sleep(a);
  else if(op==="set"){W[a]=b;applyState()}
  else if(op==="take"){W[a]="hand";W.hand=a;applyState()}
  else if(op==="place"){W[a]=b;W.hand=null;applyState()}
  else if(op==="spawn"){const g=makeTemp(a);handG.appendChild(g);await sleep(150)}
  else if(op==="despawn"){handG.querySelectorAll(".temp").forEach(e=>e.remove())}
  else if(op==="sit"){W.sitting=true;W.dir=-1;applyState();await sleep(500)}
  else if(op==="stand"){W.sitting=false;applyState();W.x=CHAIR_X[W.chair]+70;W.y=545;placeChar();await sleep(300)}
  else if(op==="fx"){if(a==="clean"){room.classList.remove("dusty")}else if(a==="shine"){const t=$id("o-table");t.classList.remove("shine");void t.getBBox();t.classList.add("shine")}
   else if(a==="watering"){$id("o-plant").classList.add("watering");await sleep(b||1200);$id("o-plant").classList.remove("watering")}}
 }
}
function makeTemp(name){const g=document.createElementNS(SVGNS,"g");g.classList.add("temp");g.innerHTML=PROP_SVG[name];g.setAttribute("transform","translate(0,10)");return g}
async function perform(a){
 if(running)return false;const why=a.pre();if(why){toastG(why);return false}
 running=true;document.body.classList.add("running");
 try{const steps=[...(W.sitting&&a.id!=="get_up"?[["stand"]]:[]),...a.seq()];await runSeq(steps)}
 finally{running=false;document.body.classList.remove("running");if(!W.sitting&&!charG.classList.contains("idle"))pose("idle")}
 return true;
}

/* =====================================================================
   5. TIẾN ĐỘ + SRS (giữ nguyên dữ liệu & thuật toán bản trước)
   ===================================================================== */
const KEY="elw_progress_v1";
let P={};try{P=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
if(!P.items){P={steps:Object.fromEntries(Object.entries(P).map(([k,v])=>[k,v.steps||{}])),items:{},pts:0}}
P.steps=P.steps||{};P.pts=P.pts||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const HOUR=36e5,SRS_HOURS=[0,4,8,23,47,167,335,719,2879],DONE=9,KNOWN=5;
const LABELS=["Chưa học","Mới học","Mới học","Mới học","Mới học","Đã thuộc","Đã thuộc","Nhớ lâu","Khắc sâu","Thành thạo"];
const stageColor=s=>s<=0?"#ddd":s<KNOWN?"#e8a25a":s<7?"#5e9a6f":s<DONE?"#3f7fa8":"#8a6bb3";
const PTS={step:1,learn:5,ok:3,hint:1};
const ivl=s=>SRS_HOURS[Math.max(1,Math.min(s,8))]*HOUR;
const stage=id=>P.items[id]?P.items[id].s:0;
function addPts(n){P.pts+=n;const e=$id("pts");e.textContent="⭐ "+P.pts;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
function learn(id){if(P.items[id])return;P.items[id]={s:1,due:Date.now()+ivl(1),ok:0,bad:0};addPts(PTS.learn);toastG(`Đã thêm “${ACT[id].sentence}” vào lịch ôn. +${PTS.learn}⭐`)}
function review(id,grade){const it=P.items[id],now=Date.now();
 if(grade==="ok"){it.s=Math.min(DONE,it.s+1);it.due=it.s>=DONE?0:now+ivl(it.s);it.ok++;addPts(PTS.ok)}
 else if(grade==="hint"){it.due=now+ivl(1);it.bad++;addPts(PTS.hint)}
 else{it.s=Math.max(1,it.s-(it.s>=KNOWN?2:1));it.due=now+ivl(it.s);it.bad++}
 save();refresh()}
const dueList=()=>Object.keys(P.items).filter(id=>ACT[id]&&P.items[id].s<DONE&&P.items[id].due<=Date.now()).sort((a,b)=>P.items[a].due-P.items[b].due);
function nextDue(){let b=0;for(const id in P.items){const it=P.items[id];if(ACT[id]&&it.s<DONE&&(!b||it.due<b))b=it.due}return b}
function fmtWait(ms){const h=ms/HOUR;return h<1?Math.max(1,Math.round(ms/6e4))+" phút":h<24?Math.round(h)+" giờ":Math.round(h/24)+" ngày"}
function mark(id,step){P.steps[id]=P.steps[id]||{};if(!P.steps[id][step]){P.steps[id][step]=true;addPts(PTS.step)}
 if(step==="recall")learn(id);save();refresh()}
function refresh(){
 const done=ACTIONS.filter(a=>stage(a.id)>0).length;
 $id("prog").textContent=`✅ ${done}/${ACTIONS.length}`;$id("pts").textContent="⭐ "+P.pts;updateGuide();
}

/* ---------- Cô Mai ---------- */
let guideAct=null,gTimer;
function updateGuide(){const t=$id("guideText"),due=dueList(),fresh=ACTIONS.find(a=>!stage(a.id)&&!a.pre());
 if(due.length){t.textContent=`Hôm nay có ${due.length} câu cần ôn. Ôn ngay để không quên nhé!`;guideAct=startReview}
 else if(fresh){t.textContent=`Thử hành động mới: “${fresh.label}” (${fresh.labelVi}).`;guideAct=()=>{selectObject(fresh.obj);startAction(fresh)}}
 else{const n=nextDue();t.textContent=n?`Giỏi lắm! Lượt ôn tiếp theo sau ${fmtWait(n-Date.now())}. Bấm ↺ Dọn phòng để làm lại các hành động.`:"Bạn đã thành thạo tất cả! 🎉";guideAct=openBook}}
function toastG(msg){$id("guideText").textContent=msg;clearTimeout(gTimer);gTimer=setTimeout(updateGuide,4000)}

/* =====================================================================
   6. ÂM THANH, THU ÂM, NHẬN DIỆN GIỌNG
   ===================================================================== */
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));voice=v.find(v=>/en-US/.test(v.lang))||v[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate=1){return new Promise(r=>{if(!("speechSynthesis" in window)){toastG("Trình duyệt không hỗ trợ phát âm.");return r()}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;u.onend=r;u.onerror=r;speechSynthesis.speak(u);setTimeout(r,8000)})}
let rec=null,chunks=[],myUrl=null;
function setupRec(btn,pbtn,res){
 if(!navigator.mediaDevices||!window.MediaRecorder){btn.disabled=true;res.textContent="Trình duyệt không hỗ trợ thu âm. Hãy nhại theo to lên.";return}
 btn.onclick=async()=>{if(rec&&rec.state==="recording"){rec.stop();return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];
   rec.ondataavailable=e=>chunks.push(e.data);
   rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());myUrl=URL.createObjectURL(new Blob(chunks));pbtn.disabled=false;btn.textContent="⏺ Thu lại";res.textContent="Đã thu xong. Nghe giọng bạn rồi nghe giọng mẫu."};
   rec.start();btn.textContent="⏹ Dừng";res.textContent="Đang thu… nói: "+cur.sentence;
  }catch(e){res.textContent="Không mở được micro. Kiểm tra quyền truy cập micro."}};
 pbtn.onclick=()=>myUrl&&new Audio(myUrl).play();
}
function norm(s){return s.toLowerCase().replace(/i am/g,"i'm").replace(/[^a-z' ]/g,"").split(/\s+/).filter(Boolean)}
function listenTo(target,out,cb){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){out.innerHTML="Trình duyệt chưa hỗ trợ nhận diện giọng nói (dùng Chrome/Edge). Hãy tự nói rồi tự đánh giá.";return}
 const r=new SR();r.lang="en-US";r.interimResults=false;out.textContent="🎙 Đang nghe…";
 r.onresult=e=>{const said=e.results[0][0].transcript,a=norm(said),b=norm(target);
  const pct=Math.round(b.filter(w=>a.includes(w)).length/b.length*100),miss=b.filter(w=>!a.includes(w));
  out.innerHTML=`Máy nghe được: “<i>${said}</i>”<br>Khớp: <b class="${pct>=75?"good":"bad"}">${pct}%</b>`+(miss.length?` — thiếu/sai: ${miss.map(w=>`<b>${w}</b>`).join(", ")}`:"")+(pct>=75?"":" — thử lại nhé!");cb&&cb(pct)};
 r.onerror=e=>out.textContent="Không nghe rõ ("+e.error+"). Thử lại hoặc kiểm tra micro.";r.start();
}

/* =====================================================================
   7. GIAO DIỆN: chọn đồ vật → chọn hành động → học 6 bước
   ===================================================================== */
const panel=$id("panel");let selObj=null,cur=null,step="look";
const STEPS=[["look","👀 Xem"],["listen","👂 Nghe"],["shadow","🔁 Nhại"],["disc","🎯 Phân biệt"],["speak","🎤 Nói"],["recall","🧠 Tự nhớ"]];
function selectObject(id){selObj=id;cur=null;document.querySelectorAll(".obj").forEach(o=>o.classList.toggle("sel",o.dataset.obj===id));renderObject();say(OBJECTS[id].en)}
function renderObject(){
 const o=OBJECTS[selObj];const acts=o.acts.map(i=>ACT[i]);
 const learned=acts.filter(a=>stage(a.id)>0).length;
 panel.innerHTML=`<div class="ohead"><b>${o.en}</b><span>${o.ipa} · ${o.vi}</span><button class="iconbtn" data-say="${o.en}">🔊</button><span style="margin-left:auto" class="meta">${learned}/${acts.length} đã học</span></div>
 <p class="hint">Chọn một hành động — nhân vật sẽ làm cho bạn xem:</p>
 <div class="acts">${acts.map(a=>{const why=a.pre();return `<button class="act" data-act="${a.id}" ${why?"disabled":""}>
  <span class="dot" style="background:${stageColor(stage(a.id))}" title="${LABELS[stage(a.id)]}"></span>
  <span style="flex:1"><b>${a.label}</b><small>${a.labelVi}</small>${why?`<span class="why">${why}</span>`:""}</span><span>${running?"":"▶"}</span></button>`}).join("")}</div>`;
 panel.querySelector("[data-say]").onclick=()=>say(o.en,.8);
 panel.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>startAction(ACT[b.dataset.act]));
}
async function startAction(a){
 if(running)return;panel.querySelectorAll(".act").forEach(b=>b.disabled=true);
 const ok=await perform(a);
 if(!ok){if(selObj)renderObject();return}
 cur=a;step="look";render();say(a.sentence,.95);
}
function sentHTML(l,hide){const s=stage(l.id),lv=s===0?"lv-new":s<KNOWN?"lv-learning":"";
 return l.sentence.split(" ").map(w=>{const c=w.replace(/[^\w']/g,""),k=l.key.includes(c);
  const v=k&&l.vocab.find(x=>{const base=x[0].split(" ")[0].replace(/e$/,"");return c.toLowerCase().startsWith(base.slice(0,Math.max(3,base.length-1)))});
  return `<span class="w ${k?"key "+lv:""}" data-w="${c}" data-vi="${v?v[2]:""}">${hide?"___":w}</span>`}).join(" ")}
function render(){
 const l=cur,st=P.steps[l.id]||{};
 let h=`<button class="back" id="backObj">← ${l.object.en} · các hành động khác</button>
 <div class="steps">${STEPS.map(([k,t])=>`<button class="${k===step?"on":""}" data-s="${k}">${st[k]?"✓ ":""}${t}</button>`).join("")}</div>`;
 if(step==="look"){
  h+=`<div class="sent">${sentHTML(l)}</div><div class="vi">${l.vi}</div>
  <div class="vocab">${l.vocab.map(v=>`<div class="chip" data-say="${v[0]}">🔊 ${v[0]} <small>${v[1]} · ${v[2]}</small></div>`).join("")}</div>
  <div class="note">💡 ${l.grammar}</div>
  <div class="pat">🔁 Cùng mẫu câu: ${l.patterns.map(p=>`<div>• ${p}</div>`).join("")}</div>
  <button class="btn" id="next">Tiếp: Nghe →</button><button class="btn sec" id="redo">🎬 Xem lại</button>`}
 if(step==="listen"){
  h+=`<div class="sent">${sentHTML(l)}</div><div class="vi">${l.vi}</div>
  <button class="btn" data-play="0.6">🐢 Chậm</button><button class="btn" data-play="1">▶️ Tự nhiên</button>
  <p class="hint">Nhấn vào từng từ trong câu để nghe riêng.</p><button class="btn sec" id="next">Tiếp: Nhại →</button>`}
 if(step==="shadow"){
  h+=`<div class="sent">${sentHTML(l)}</div><p>Nghe từng cụm, dừng lại, rồi nói theo to lên:</p>
  <div id="chunks">${l.chunks.map((c,i)=>`<span class="chunk" data-i="${i}">${c}</span>`).join("")}</div>
  <button class="btn" id="shadowGo">▶️ Bắt đầu nhại</button><hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
  <p>Thu âm giọng bạn và so sánh với giọng mẫu:</p>
  <button class="btn" id="rec">⏺ Thu âm</button><button class="btn sec" id="myplay" disabled>🎧 Giọng tôi</button><button class="btn sec" data-play="1">🔊 Giọng mẫu</button>
  <div class="res" id="recres"></div><button class="btn sec" id="next">Tiếp →</button>`}
 if(step==="disc"){const opts=[...l.disc.opts].sort(()=>Math.random()-.5);
  h+=`<p><b>Bạn nghe thấy từ nào?</b></p><button class="btn" id="discPlay">🔊 Nghe</button>
  <div class="opts">${opts.map(o=>`<button class="btn sec" data-ans="${o}">${o}</button>`).join("")}</div><div class="res" id="discres"></div>`}
 if(step==="speak"||step==="recall"){const hide=step==="recall";
  h+=hide?`<p>Câu đã bị ẩn. Nhìn nhân vật và <b>tự nói</b> câu tiếng Anh.</p><div class="sent">${sentHTML(l,true)}</div><div class="vi">Gợi ý: ${l.vi}</div>`
   :`<p>Nói câu này vào micro:</p><div class="sent">${sentHTML(l)}</div>`;
  h+=`<button class="btn" id="mic">🎤 Bấm và nói</button><div class="res" id="speakres"></div>
  <p class="hint">Hệ thống so khớp chữ được nhận diện, không phải chấm điểm phát âm chính xác.</p>
  <button class="btn sec" id="selfok">Tôi đã nói được ✓</button>`}
 panel.innerHTML=h;bind();
}
function goNext(){mark(cur.id,step);const i=STEPS.findIndex(s=>s[0]===step);
 if(step==="recall"){selectObject(cur.obj);return}
 step=STEPS[Math.min(i+1,STEPS.length-1)][0];render()}
function bind(){
 const l=cur,q=s=>panel.querySelector(s);
 q("#backObj").onclick=()=>selectObject(l.obj);
 panel.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{step=b.dataset.s;render()});
 panel.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say,.8));
 panel.querySelectorAll(".w").forEach(b=>b.onclick=()=>say(b.dataset.w,.8));
 panel.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>say(l.sentence,+b.dataset.play));
 if(q("#next"))q("#next").onclick=goNext;
 if(q("#redo"))q("#redo").onclick=async()=>{if(l.pre()){toastG("Trạng thái phòng đã thay đổi: "+l.pre()+" Bấm ↺ Dọn phòng để xem lại.");pulse(l.obj);return}await perform(l);render()};
 if(q("#shadowGo"))q("#shadowGo").onclick=async()=>{const cs=panel.querySelectorAll(".chunk");
  for(let r=0;r<2;r++)for(let i=0;i<cs.length;i++){cs.forEach(c=>c.classList.remove("on"));cs[i].classList.add("on");await say(l.chunks[i],.75);await sleep(1800)}
  cs.forEach(c=>c.classList.remove("on"));await say(l.sentence,.9)};
 if(q("#rec"))setupRec(q("#rec"),q("#myplay"),q("#recres"));
 if(q("#discPlay")){q("#discPlay").onclick=()=>say(l.disc.ans,.8);
  panel.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{const ok=b.dataset.ans===l.disc.ans;
   q("#discres").innerHTML=ok?`<span class="good">✅ Đúng rồi! “${l.disc.ans}”</span> <button class="btn sec" id="n2">Tiếp →</button>`
    :`<span class="bad">❌ Chưa đúng. Nghe lại “${b.dataset.ans}” và “${l.disc.ans}” để so sánh.</span>`;
   if(!ok)say(b.dataset.ans,.8).then(()=>say(l.disc.ans,.8));else q("#n2").onclick=goNext})}
 if(q("#mic"))q("#mic").onclick=()=>listenTo(l.sentence,q("#speakres"),pct=>{if(pct>=75){q("#speakres").insertAdjacentHTML("beforeend",` <button class="btn" id="n3">Tuyệt! Tiếp →</button>`);q("#n3").onclick=goNext}});
 if(q("#selfok"))q("#selfok").onclick=goNext;
}
function pulse(obj){const o=document.querySelector(`[data-obj="${obj}"]`);if(!o)return;o.classList.remove("pulse");void o.getBBox();o.classList.add("pulse")}

/* scene clicks */
document.querySelectorAll(".obj").forEach(o=>{const go=()=>{if(!running)selectObject(o.dataset.obj)};
 o.addEventListener("click",go);o.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})});
charG.style.cursor="pointer";
charG.addEventListener("click",()=>{if(running)return;const h=W.hand;if(W.sitting)selectObject("chair");else if(h&&OBJECTS[h])selectObject(h);else if(h==="milk")selectObject("fridge");else toastG(W.sitting?"Bạn đang ngồi. Chọn ghế → Get up để đứng dậy.":"Xin chào! Hãy nhấn vào một đồ vật để mình làm cho bạn xem.")});
$id("btnTags").onclick=()=>room.classList.toggle("show-tags");
$id("btnReset").onclick=()=>{if(running)return;const keep={x:W.x,y:W.y,dir:W.dir};W={...W0,...keep};handG.querySelectorAll(".temp").forEach(e=>e.remove());room.classList.add("dusty");applyState();pose("idle");if(selObj)renderObject();toastG("Đã dọn phòng: mọi đồ vật về chỗ cũ.")};

/* =====================================================================
   8. MODAL: sổ từ & phiên ôn
   ===================================================================== */
const modal=$id("modal"),mbox=$id("mbox");
function showModal(h){mbox.innerHTML=h;modal.hidden=false;const c=mbox.querySelector("[data-close]");if(c)c.onclick=closeModal}
function closeModal(){modal.hidden=true;if("speechSynthesis" in window)speechSynthesis.cancel();refresh();if(selObj&&!cur)renderObject()}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeModal()});
function openBook(){
 const learned=ACTIONS.filter(a=>stage(a.id)>0).length;
 const groups=Object.entries(OBJECTS).map(([oid,o])=>{const list=ACTIONS.filter(a=>a.obj===oid);if(!list.length)return"";
  return `<h3>${o.en} · ${o.vi}</h3><div class="tiles">${list.map(l=>{const s=stage(l.id),it=P.items[l.id];
   const when=!s?"":s>=DONE?"Không cần ôn nữa":it.due<=Date.now()?"Cần ôn ngay":"Ôn sau "+fmtWait(it.due-Date.now());
   return `<div class="tile" style="--sc:${stageColor(s)}" data-open="${l.id}"><div class="en">${s?l.sentence:"🔒 "+l.label}</div>
    <div class="meta">${s?l.vi:l.labelVi}</div><div class="meta"><b>${LABELS[s]}</b>${when?" · "+when:""}</div></div>`}).join("")}</div>`}).join("");
 showModal(`<h2>📒 Sổ từ vựng <button class="iconbtn" data-close>✕</button></h2>
  <div class="meta">Đã học ${learned}/${ACTIONS.length} câu · ${dueList().length} câu cần ôn</div>
  <div class="legend">${[[1,"Mới học"],[5,"Đã thuộc"],[7,"Nhớ lâu / Khắc sâu"],[9,"Thành thạo"],[0,"Chưa học"]].map(([s,t])=>`<span><i style="background:${stageColor(s)}"></i>${t}</span>`).join("")}</div>
  ${groups}${dueList().length?`<button class="btn" id="bookReview" style="margin-top:12px">🔁 Ôn ${dueList().length} câu ngay</button>`:""}`);
 mbox.querySelectorAll("[data-open]").forEach(t=>t.onclick=()=>{const a=ACT[t.dataset.open];closeModal();selectObject(a.obj);if(stage(a.id)){cur=a;step="look";render()}});
 const br=mbox.querySelector("#bookReview");if(br)br.onclick=startReview;
}
$id("btnBook").onclick=openBook;$id("guide").onclick=()=>guideAct&&guideAct();
let rq=[],rStats;
function startReview(){rq=dueList();rStats={ok:0,hint:0,bad:0};nextReview()}
function nextReview(){
 if(!rq.length){showModal(`<h2>🎉 Ôn xong! <button class="iconbtn" data-close>✕</button></h2>
  <p>Đúng: <b class="good">${rStats.ok}</b> · Nhờ gợi ý: <b>${rStats.hint}</b> · Chưa nhớ: <b class="bad">${rStats.bad}</b></p>
  <p class="hint">Câu đúng sẽ quay lại sau lâu hơn; câu sai sẽ quay lại sớm hơn.</p><button class="btn" id="close2">Xong</button>`);
  $id("close2").onclick=closeModal;return}
 const l=ACT[rq[0]],s=stage(l.id);let usedHint=false;pulse(l.obj);
 showModal(`<h2>🔁 Ôn tập <span class="meta" style="font-weight:400">còn ${rq.length} câu · ${LABELS[s]}</span><button class="iconbtn" data-close>✕</button></h2>
  <p>Đồ vật: <b>${l.object.en}</b> (${l.object.vi}). Nói câu tiếng Anh cho:</p><div class="sent" style="font-size:20px">“${l.vi}”</div>
  <div id="rhint" class="vi"></div>
  <button class="btn" id="rmic">🎤 Nói</button><button class="btn sec" id="rhintBtn">💡 Gợi ý</button><button class="btn sec" id="rshow">👀 Xem đáp án</button>
  <div class="res" id="rres"></div><div id="rgrade" hidden style="margin-top:10px">
   <p class="hint">Bạn tự đánh giá:</p><button class="btn" data-g="ok" style="background:var(--ok)">✅ Tôi nói đúng</button><button class="btn sec" data-g="bad">❌ Chưa nhớ</button></div>`);
 const q=s=>mbox.querySelector(s);
 const reveal=()=>{q("#rhint").innerHTML=`<b style="color:var(--ink);font-size:20px">${l.sentence}</b>`;say(l.sentence,.9);q("#rgrade").hidden=false};
 q("#rhintBtn").onclick=()=>{usedHint=true;q("#rhint").textContent="Gợi ý: "+l.sentence.split(" ").map((w,i)=>i<2?w:w[0]+"…").join(" ")};
 q("#rshow").onclick=reveal;
 q("#rmic").onclick=()=>listenTo(l.sentence,q("#rres"),()=>reveal());
 mbox.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g==="ok"?(usedHint?"hint":"ok"):"bad";
  review(l.id,g);rStats[g]++;rq.shift();nextReview()});
}

/* =====================================================================
   9. TẢI ẢNH THẬT THEO MANIFEST (nếu có)
   ===================================================================== */
function loadAssets(){
 for(const [id,a] of Object.entries(ASSETS)){
  const img=new Image();
  img.onload=()=>{assetStatus[id]="ok";
   if(a.prop){const p=props[a.prop],bb=p.getBBox();[...p.children].forEach(c=>{if(!c.classList.contains("hit")&&!c.classList.contains("fill"))c.remove()});
    const im=document.createElementNS(SVGNS,"image");im.setAttribute("href",a.file);["x","y","width","height"].forEach(k=>im.setAttribute(k,bb[k]));im.setAttribute("preserveAspectRatio","xMidYMax meet");
    const fl=p.querySelector(".fill");fl?p.insertBefore(im,fl):p.appendChild(im)}
   else{const g=$id(a.target).querySelector(".vec"),bb=g.getBBox();const im=document.createElementNS(SVGNS,"image");
    im.setAttribute("href",a.file);["x","y","width","height"].forEach(k=>im.setAttribute(k,bb[k]));im.setAttribute("preserveAspectRatio","xMidYMax meet");
    [...g.children].forEach(c=>{if(!c.id)c.style.display="none"});g.appendChild(im)}};
  img.onerror=()=>{assetStatus[id]="missing"};img.src=a.file;
 }
 setTimeout(()=>console.info("[assets]",assetStatus),1500);
}

room.classList.add("dusty");applyState();pose("idle");refresh();loadAssets();
window.ELW={W,ACTIONS,perform:id=>perform(ACT[id]),state:()=>W,assets:assetStatus};
</script>
